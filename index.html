<script type="text/babel" data-type="module">
const {useState,useEffect,useRef,useCallback}=React;
const DB_NAME="fenstercheck_db",STORE="projects";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const FLOORS=["UG3","UG2","UG1","EG","OG1","OG2","OG3","OG4","OG5","OG6","OG7","OG8","OG9","OG10","DG"];
const ORIENTATIONS=["N","NO","O","SO","S","SW","W","NW"];
const FEN_TYPEN=["Dreh","Kipp","Dreh-Kipp","Fest","Schiebe","Klapp","Sonstig"];   // Öffnungsarten je Feld der Geometrie
const FEN_BAUART=["Einfachfenster","Verbundfenster","Kastenfenster","Fenstertür","Festverglasung","Pfosten-Riegel","Dachfenster","Sonstig"];   // Bauart auf Fensterebene
const FRAME_MAT=["Holz","Holz-Metall","Kunststoff","Kunststoff-Metall","Metall","Unbekannt"];
const GLAZ_TYPES=["2-fach IV","2-fach WSV","3-fach WSV","Unbekannt"];
const LOWE_OPT=["Ja","Nein","Unbekannt"];
const GAS_TYPES=["Luft","Argon","Krypton","Argon/Krypton","Unbekannt"];   // Argon/Krypton = Mischfüllung (Stempel «Ar/Kr»)
const RV_TYPES=["Aluminium","Edelstahl (Warm Edge)","Kunststoff (TGI/TPS)","Unbekannt"];
const RV_ZUST=["Intakt","Undicht","Beschlagen","Defekt"];
const VG_DICHT=["Nassverglasung (Silikon)","Trockenverglasung (Gummidichtung)","Unbekannt"];
const DI_ANZ=["0","1","2","3"];
const DI_MAT=["EPDM","Silikon","TPE","PVC","Unbekannt"];
const DI_ZUST=["Intakt","Spröde","Verformt","Fehlend"];
const BE_TYP=["Einhand-Drehkipp","Olive+Stange","Getriebe","Sonstig"];
const BE_ZUST=["Funktionsfähig","Schwergängig","Ausgeschlagen","Defekt"];
const ZU_SIMPLE=["Gut","Mittel","Schlecht"];
const ZU_DET=["Rahmen: Gut","Rahmen: Beschädigt","Rahmen: Verwittert","Dichtung: Intakt","Dichtung: Spröde","Dichtung: Fehlend","Glas: Intakt","Glas: Beschlagen","Glas: Gesprungen","Beschlag: Funktionsfähig","Beschlag: Schwergängig","Beschlag: Defekt"];
const DSRC=["M","H","P"];
const DSRC_L={M:"Messwert",H:"Herstellerang.",P:"Planungsdaten"};
const FEN_AB={"Dreh":"D","Kipp":"K","Dreh-Kipp":"DK","Fest":"F","Schiebe":"S","Klapp":"Kl","Sonstig":"?"};
const RM_POS=[["oben","Oben"],["unten","Unten"],["links","Links"],["rechts","Rechts"],["mittelV","Mittelsteg vertikal"],["mittelH","Mittelsteg horizontal"]];
const ROW_ROLES=["Hauptfenster","Oberlicht","Brüstung","Seitenteil","Zwischenfeld"];
const APP_VERSION="v19 · September 2026";
const APP_REPO="https://github.com/ReSolRe/FensterCheck";

// Editierbare thermische Standardwerte (global + Projekt-Override)
const UF_EPOCHS=["<1980","1980-1994","1995-2009",">=2010"];
const DEFAULT_TABLES={
  uf:{"Holz":{"<1980":2.0,"1980-1994":1.8,"1995-2009":1.6,">=2010":1.3},
      "Holz-Metall":{"<1980":2.2,"1980-1994":2.0,"1995-2009":1.7,">=2010":1.3},
      "Kunststoff":{"<1980":2.2,"1980-1994":2.0,"1995-2009":1.5,">=2010":1.2},
      "Kunststoff-Metall":{"<1980":2.4,"1980-1994":2.1,"1995-2009":1.6,">=2010":1.2},
      "Metall":{"<1980":5.0,"1980-1994":4.0,"1995-2009":2.6,">=2010":1.8},
      "Unbekannt":{"<1980":"","1980-1994":"","1995-2009":"",">=2010":""}},
  ug:{"2-fach IV":3.0,"2-fach WSV":1.3,"3-fach WSV":0.7,"Unbekannt":""},
  g:{"2-fach IV":0.76,"2-fach WSV":0.62,"3-fach WSV":0.50,"Unbekannt":""},
  psi:{"Aluminium":0.08,"Edelstahl (Warm Edge)":0.05,"Kunststoff (TGI/TPS)":0.04,"Unbekannt":""}
};
const TD_KEY="fc_thermalDefaults_v1";
let _gtd=null;
function loadGlobalTD(){if(_gtd)return _gtd;try{const s=localStorage.getItem(TD_KEY);_gtd=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_TABLES));}catch(e){_gtd=JSON.parse(JSON.stringify(DEFAULT_TABLES));}return _gtd;}
function saveGlobalTD(t){_gtd=t;try{localStorage.setItem(TD_KEY,JSON.stringify(t));}catch(e){}}
function effTD(p){return (p&&p.thermalDefaults)||loadGlobalTD()||DEFAULT_TABLES;}
const ufEpoch=y=>{const n=parseInt(y,10);if(!n)return null;return n<1980?"<1980":n<1995?"1980-1994":n<2010?"1995-2009":">=2010";};
function resolveDef(k,fen,vg,p){
  const T=effTD(p),flat=(p&&p.defaults&&p.defaults[k])||"";
  const sel=(rec,key)=>(rec&&rec.data&&rec.data[key])||(p&&p.defaults&&p.defaults[key])||"";
  let cond="";
  if(k==="ufWert"){const m=sel(fen,"rahmenMaterial"),ep=ufEpoch(sel(fen,"baujahr"));if(m&&m!=="Unbekannt"&&ep&&T.uf[m])cond=T.uf[m][ep];}
  else if(k==="ugWert"||k==="gWert"){const gt=sel(vg,"verglasungsTyp");if(gt&&gt!=="Unbekannt")cond=(k==="ugWert"?T.ug:T.g)[gt];}
  else if(k==="psiWert"){const rv=sel(vg,"randverbundTyp");if(rv&&rv!=="Unbekannt")cond=T.psi[rv];}
  return (cond===0||cond)&&cond!==""?String(cond):flat;
}
// Geometrie – rekursiver Teilungsbaum (Guillotine-Schnitte): f.geometrie={tree}. Blatt={art,band,vg,role}, Teilung={dir:"v"|"h",w:[…],kids:[…],role[,steg]}
// Alte Formen (Zeilen-Modell rows/cells, ältestes Raster fluegel/oberlicht/…) werden in normalizeGeo verlustfrei umgewandelt.
const BAND_L={"":"","L":"Links","R":"Rechts","O":"Oben","U":"Unten"};
const GEO_BANDS={"Dreh":["L","R"],"Dreh-Kipp":["L","R"],"Kipp":["O","U"],"Klapp":["O","U"]};
const GEO_BAND_DEF={"Kipp":"U","Klapp":"O"};
const GEO_MAX_DEPTH=5,GEO_ASPECT_DEF=1.2,GEO_GAP={pfosten:6,stulp:2,riegel:6}; // Trennelemente in viewBox-Einheiten (größere Seite = 300)
const geoBandFor=(art,band)=>{const ok=GEO_BANDS[art]||[];return ok.includes(band)?band:(GEO_BAND_DEF[art]||"");};
const geoLeaf=p=>({art:"",band:"",vg:"",role:"",...(p||{})});
const geoIsLeaf=n=>!Array.isArray(n.kids);
const newGeo=()=>({tree:geoLeaf()});
const geoClone=g=>JSON.parse(JSON.stringify(g));
const geoPath=(parent,i)=>parent===""?String(i):parent+"."+i;   // Pfad "" = Wurzel, "1.0" = kids[1].kids[0] (Achtung: "" ist falsy → immer !=null prüfen)
const geoParentPath=p=>{const i=p.lastIndexOf(".");return i<0?"":p.slice(0,i);};
const geoIdx=p=>+p.slice(p.lastIndexOf(".")+1);
function geoNode(g,path){if(path==null)return null;let n=g.tree;if(path==="")return n;for(const s of path.split(".")){if(!n||!n.kids||!n.kids[+s])return null;n=n.kids[+s];}return n;}
// Knoten reparieren/kanonisieren: Teilung mit einem Kind → Kind, Gewichte ganzzahlig ≥1, nur gültige Werte, feste Schlüsselreihenfolge
function geoFixNode(n){
  if(!n||typeof n!=="object")return geoLeaf();
  if(Array.isArray(n.kids)){
    const kids=n.kids.map(geoFixNode),role=ROW_ROLES.includes(n.role)?n.role:"";
    if(kids.length===0)return geoLeaf({role});
    if(kids.length===1){const k=kids[0];if(!k.role&&role)k.role=role;return k;}
    const dir=n.dir==="v"?"v":"h";
    const w=kids.map((_,i)=>{const x=Math.round(+(n.w&&n.w[i]));return x>=1?x:1;});
    const out={dir,w,kids,role};if(dir==="v")out.steg=n.steg==="stulp"?"stulp":"pfosten";
    return out;}
  const art=FEN_TYPEN.includes(n.art)?n.art:"";
  return {art,band:(GEO_BANDS[art]||[]).includes(n.band)?n.band:"",vg:typeof n.vg==="string"?n.vg:"",role:ROW_ROLES.includes(n.role)?n.role:""};
}
function geoFromRows(rows,cells){  // Zeilen-Modell → Baum (verlustfrei; Leserichtung oben→unten, links→rechts bleibt)
  const c=k=>(cells&&cells[k])||{};
  const rowNode=(row,ri)=>{const cols=row.cols||1;
    if(cols<=1)return geoLeaf({art:c(ri+":0").art,band:c(ri+":0").band,vg:c(ri+":0").vg,role:row.role});
    const w=(row.w&&row.w.length===cols)?row.w.slice():Array(cols).fill(1);
    return {dir:"v",w,kids:Array.from({length:cols},(_,ci)=>geoLeaf({art:c(ri+":"+ci).art,band:c(ri+":"+ci).band,vg:c(ri+":"+ci).vg})),role:row.role||"",steg:"pfosten"};};
  if(!rows.length)return geoLeaf();
  if(rows.length===1)return rowNode(rows[0],0);
  return {dir:"h",w:rows.map(r=>r.h||1),kids:rows.map(rowNode),role:""};
}
function normalizeGeo(g){
  if(!g||typeof g!=="object")return newGeo();
  if(g.tree)return {tree:geoFixNode(g.tree)};
  if(Array.isArray(g.rows))return {tree:geoFixNode(geoFromRows(g.rows,g.cells))};
  if("fluegel" in g){const rows=[],cells={};if(g.oberlicht)rows.push({h:1,cols:1,role:"Oberlicht"});const mi=rows.length;rows.push({h:3,cols:g.fluegel||1});if(g.bruestung)rows.push({h:1,cols:1,role:"Brüstung"});
    for(let c=0;c<(g.fluegel||1);c++){const t=g.oeff&&g.oeff["main:"+c+":0:0"];if(t)cells[mi+":"+c]={art:t,band:""};}
    return {tree:geoFixNode(geoFromRows(rows,cells))};}
  return newGeo();
}
function geoLeaves(g){g=normalizeGeo(g);const out=[];const walk=(n,path)=>{if(geoIsLeaf(n))out.push({path,node:n});else n.kids.forEach((k,i)=>walk(k,geoPath(path,i)));};walk(g.tree,"");return out;}
function geoCellCount(g){return geoLeaves(g).length;}
function geoMovableCount(g){return geoLeaves(g).filter(l=>l.node.art&&l.node.art!=="Fest"&&l.node.art!=="Sonstig").length;}
function geoHasContent(g){return geoLeaves(g).some(l=>l.node.art||l.node.vg);}
function geoAspect(b,h){const B=parseFloat(b),H=parseFloat(h);if(B>0&&H>0)return Math.round(Math.min(3,Math.max(0.4,B/H))*100)/100;return GEO_ASPECT_DEF;}
// Export-Text: Struktur (Blatt = Kürzel(Band), " / " übereinander, " | " Pfosten, " ¦ " Stulp, [ ] verschachtelt) + Liste der Öffnungsarten
function geoSummary(g){g=normalizeGeo(g);const t=g.tree;if(geoIsLeaf(t)&&!t.art&&!t.role)return "";
  const s=(n,root)=>{const r=n.role?n.role+":":"";if(geoIsLeaf(n))return r+(n.art?(FEN_AB[n.art]||"?")+(n.band?"("+n.band+")":""):"-");
    const sep=n.dir==="h"?" / ":(n.steg==="stulp"?" ¦ ":" | ");const inner=n.kids.map(k=>s(k,false)).join(sep);return r+(root?inner:"["+inner+"]");};
  const ops=geoLeaves(g).filter(l=>l.node.art).map(l=>l.node.art+(l.node.band?"("+l.node.band+")":""));
  return s(t,true)+(ops.length?"; Öffnung: "+ops.join(", "):"");}
// Transformationen: liefern immer ein neues, normalisiertes {tree}; ungültiger Pfad → unverändert
function geoMapLeaves(g,fn){g=geoClone(normalizeGeo(g));let i=0;const walk=(n,path)=>{if(geoIsLeaf(n))return geoLeaf(fn(n,path,i++));n.kids=n.kids.map((k,j)=>walk(k,geoPath(path,j)));return n;};g.tree=walk(g.tree,"");return normalizeGeo(g);}
function geoRemapVg(g,map){return geoMapLeaves(g,l=>({...l,vg:l.vg?(map[l.vg]||""):""}));}   // Duplizieren: Verglasungs-IDs umhängen
function geoUnlinkVg(g,vgId){return geoMapLeaves(g,l=>l.vg===vgId?{...l,vg:""}:l);}         // Verglasung gelöscht: Verknüpfung lösen
function geoFromArt(art){const a=FEN_TYPEN.includes(art)?art:"";return {tree:geoLeaf({art:a,band:geoBandFor(a,"")})};}  // Ein-Feld-Geometrie (Migration „Fenstertyp")
function geoSetLeaf(g,path,patch){g=geoClone(normalizeGeo(g));const n=geoNode(g,path);if(!n||!geoIsLeaf(n))return g;const oldArt=n.art;Object.assign(n,patch);  // Artwechsel: Vorbelegung (Kipp=U, Klapp=O), sonst zulässiges Band behalten
  if("art" in patch&&patch.art!==oldArt)n.band=GEO_BAND_DEF[n.art]||geoBandFor(n.art,n.band);else if("band" in patch)n.band=geoBandFor(n.art,n.band);return normalizeGeo(g);}
function geoSetNode(g,path,patch){g=geoClone(normalizeGeo(g));const n=geoNode(g,path);if(!n)return g;Object.assign(n,patch);return normalizeGeo(g);}
// Feld teilen (1:1): Rolle wandert auf die Teilung; erstes Kind erbt Art/Band/Verglasung, zweites nur die Art (Band bei senkrechter Teilung gespiegelt)
function geoSplit(g,path,dir){g=geoClone(normalizeGeo(g));const n=geoNode(g,path);if(!n||!geoIsLeaf(n)||(path&&path.split(".").length>=GEO_MAX_DEPTH))return g;
  const mirror=b=>b==="L"?"R":b==="R"?"L":b;const a={...n,role:""},b={...n,role:"",vg:"",band:dir==="v"?mirror(n.band):n.band};
  const sp={dir:dir==="v"?"v":"h",w:[1,1],kids:[a,b],role:n.role};if(sp.dir==="v")sp.steg="pfosten";
  if(path==="")g.tree=sp;else{const pa=geoNode(g,geoParentPath(path));pa.kids[geoIdx(path)]=sp;}return normalizeGeo(g);}
function geoRemove(g,path){g=geoClone(normalizeGeo(g));if(!path)return g;const pa=geoNode(g,geoParentPath(path));if(!pa||!pa.kids)return g;const i=geoIdx(path);pa.kids.splice(i,1);pa.w.splice(i,1);return normalizeGeo(g);}
function geoSetWeight(g,path,delta){g=geoClone(normalizeGeo(g));if(!path)return g;const pa=geoNode(g,geoParentPath(path));if(!pa||!pa.w)return g;const i=geoIdx(path);pa.w[i]=Math.max(1,(pa.w[i]||1)+delta);return g;}
function geoAddBand(g,top,role){g=geoClone(normalizeGeo(g));const leaf=geoLeaf({role}),t=g.tree;   // + Oberlicht (oben) / + Brüstung (unten)
  if(!geoIsLeaf(t)&&t.dir==="h"){const w=Math.max(1,Math.round(t.w.reduce((a,b)=>a+b,0)/3));if(top){t.kids.unshift(leaf);t.w.unshift(w);}else{t.kids.push(leaf);t.w.push(w);}}
  else g.tree=top?{dir:"h",w:[1,3],kids:[leaf,t],role:""}:{dir:"h",w:[3,1],kids:[t,leaf],role:""};
  return normalizeGeo(g);}
// Rechtecke aller Knoten (Pre-Order) + Trennelemente {sep} in viewBox-Einheiten; dir v teilt die Breite, dir h die Höhe nach den Gewichten w
function geoLayout(node,x,y,w,h,path,out){path=path||"";out=out||[];out.push({path,node,leaf:geoIsLeaf(node),x,y,w,h});if(geoIsLeaf(node))return out;
  const v=node.dir==="v",n=node.kids.length,sep=v?(node.steg==="stulp"?"stulp":"pfosten"):"riegel",gap=GEO_GAP[sep];
  const avail=Math.max(0,(v?w:h)-gap*(n-1)),sum=node.w.reduce((a,b)=>a+b,0)||n;let pos=v?x:y;
  node.kids.forEach((k,i)=>{const sz=node.w[i]/sum*avail,kp=geoPath(path,i);
    if(v)geoLayout(k,pos,y,sz,h,kp,out);else geoLayout(k,x,pos,w,sz,kp,out);
    if(i<n-1)out.push({sep,path:kp+"#",x:v?pos+sz:x,y:v?y:pos+sz,w:v?gap:w,h:v?h:gap});
    pos+=sz+gap;});return out;}
// Vorlagen-Galerie: jede make() liefert einen frischen Baum (Band L/R ist Vorbelegung)
const _Lf=(art,band,role)=>geoLeaf({art:art||"",band:band||"",role:role||""});
const _V=(kids,w,steg,role)=>({dir:"v",w:w||kids.map(()=>1),kids,role:role||"",steg:steg||"pfosten"});
const _H=(kids,w,role)=>({dir:"h",w:w||kids.map(()=>1),kids,role:role||""});

  {id:"dk1b",name:"1-flg + Brüstung",make:()=>({tree:_H([_Lf("Dreh-Kipp","L"),_Lf("Fest","","Brüstung")],[3,1])})},
  {id:"tuer",name:"Fenstertür",aspect:0.45,make:()=>({tree:_Lf("Dreh-Kipp","L")})},

  {id:"schieb",name:"Schiebe 2-teilig",make:()=>({tree:_V([_Lf("Schiebe"),_Lf("Schiebe")],[1,1],"stulp")})},
  {id:"dkkdk",name:"DK | Kipp/DK",make:()=>({tree:_V([_Lf("Dreh-Kipp","L"),_H([_Lf("Kipp","U"),_Lf("Dreh-Kipp","R")],[1,2])],[1,1],"pfosten")})},
  {id:"dk2ob",name:"2-flg + Oberl. + Brüst.",make:()=>({tree:_H([_Lf("Kipp","U","Oberlicht"),_V([_Lf("Dreh","L"),_Lf("Dreh-Kipp","R")],[1,1],"stulp"),_Lf("Fest","","Brüstung")],[1,3,1])})},
  {id:"leer",name:"Leer (1 Feld)",make:()=>newGeo()},
];
function masseSummary(m){if(!m)return "";const ab={oben:"O",unten:"U",links:"L",rechts:"R",mittelV:"MV",mittelH:"MH"};return RM_POS.map(([k])=>{const v=m[k]||{};const i=v.i||"",a=v.a||"";return (i||a)?ab[k]+" "+(i||"-")+"/"+(a||"-"):"";}).filter(Boolean).join(" · ");}

// Fields that support project-level defaults
const DEFAULTABLE_FIELDS = [
  "verglasungsTyp","scheibenaufbau","glasDichtung","glasDichtungAussen","lowE","gasart","randverbundTyp",
  "ugWert","gWert","rahmenMaterial","rahmenProfiltiefe","baujahr",
  "ufWert","psiWert","dichtungAnzahl","dichtungMaterial"
];

const FIELDS={
  // Fenster – Lage & Aufbau
  fassade:{label:"Fassadenorientierung",g:"f",t:"select",o:ORIENTATIONS,sec:"lage"},

// Erfassungsprofile = Voreinstellung für eine Begehung. Beim Wählen setzt ein Profil die aktiven Felder, den Modus

const profOf=p=>(p&&PROFILES[p.profil])||null;
// Profil anwenden (neues Objekt): Felder, Zustand Rahmen, Datenquelle – Daten bleiben unberührt
function applyProfile(p,key){const pr=PROFILES[key];if(!pr)return p;return {...p,profil:key,activeFields:[...pr.fields],zustandModus:pr.zustand,showSrc:!!pr.src};}

  return pr.fields.length!==a.size||pr.fields.some(k=>!a.has(k))||(p.zustandModus||"Keine")!==pr.zustand||!!p.showSrc!==!!pr.src;}

// IndexedDB – eine gemeinsame Verbindung; Stores: projects (Projektdaten) + photos (Bild-Blobs).
// Fotos liegen bewusst NICHT im Projektobjekt: jede Änderung klont das ganze Projekt.
const PSTORE="photos";
let _dbP=null;
function openDB(){if(_dbP)return _dbP;_dbP=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,5);
  r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"});if(!db.objectStoreNames.contains(PSTORE))db.createObjectStore(PSTORE,{keyPath:"id"});};
  r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();_dbP=null;};res(db);};
  r.onerror=()=>{_dbP=null;rej(r.error);};
  r.onblocked=()=>alert("FensterCheck ist noch in einem anderen Tab/Fenster geöffnet. Bitte dort schließen und hier neu laden.");});return _dbP;}
function idb(store,mode,fn){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode);const rq=fn(t.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("Speichern abgebrochen (Speicher voll?)"));}));}
const dbAll=()=>idb(STORE,"readonly",s=>s.getAll());
const dbPut=d=>idb(STORE,"readwrite",s=>s.put(d));
const dbDel=k=>idb(STORE,"readwrite",s=>s.delete(k));
const phPut=rec=>idb(PSTORE,"readwrite",s=>s.put(rec));
const phGet=id=>idb(PSTORE,"readonly",s=>s.get(id));
const phDel=ids=>ids&&ids.length?idb(PSTORE,"readwrite",s=>{ids.forEach(id=>s.delete(id));}).catch(()=>{}):Promise.resolve();
const phKeys=()=>idb(PSTORE,"readonly",s=>s.getAllKeys());

// Fotos: Vollbild (max. PH_MAX px, JPEG) + Vorschaubild als Blobs im photos-Store.
// Im Projekt steht nur {id,zeit,w,h,kb,isStempel?,ms?,msId?} (ms/msId: Messfoto zu einem Messwert). Alte Fotos haben noch "data" (DataURL) und werden migriert.
const PH_MAX=1920,PH_Q=0.82,TH_MAX=320,TH_Q=0.7;
function loadImg(src){return new Promise((res,rej)=>{const img=new Image();const isB=src instanceof Blob;const u=isB?URL.createObjectURL(src):src;
  img.onload=()=>{if(isB)URL.revokeObjectURL(u);res(img);};img.onerror=()=>{if(isB)URL.revokeObjectURL(u);rej(new Error("Bild konnte nicht gelesen werden"));};img.src=u;});}
function scaledCanvas(img,max){const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;const s=Math.min(1,max/Math.max(W,H));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;}
const toJpeg=(c,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Bild konnte nicht umgewandelt werden")),"image/jpeg",q));
function dataURLtoBlob(d){const i=d.indexOf(",");const type=d.slice(5,i).split(";")[0]||"image/jpeg";const bin=atob(d.slice(i+1));const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type});}
// Neues Foto aus Kamera/Galerie verkleinern, speichern und Projekt-Metadaten liefern
async function storeNewPhoto(file){const img=await loadImg(file);const full=scaledCanvas(img,PH_MAX);const blob=await toJpeg(full,PH_Q);const tblob=await toJpeg(scaledCanvas(img,TH_MAX),TH_Q);const id=uid();
  await phPut({id,blob,tblob,w:full.width,h:full.height});return {id,zeit:new Date().toISOString(),w:full.width,h:full.height,kb:Math.round(blob.size/1024)};}
// Vorhandenes Bild (Blob oder DataURL) ohne Neukodierung übernehmen – immer mit neuer ID (Migration/Import)
async function storeExistingPhoto(meta,src){const blob=src instanceof Blob?src:dataURLtoBlob(src);let w=meta.w,h=meta.h,tblob=null;
  try{const img=await loadImg(blob);w=img.naturalWidth;h=img.naturalHeight;tblob=await toJpeg(scaledCanvas(img,TH_MAX),TH_Q);}catch(e){}
  const id=uid();await phPut({id,blob,tblob,w,h});const m={...meta,id,w,h,kb:Math.round(blob.size/1024)};delete m.data;delete m.file;return m;}
async function photoBlob(ph){if(ph.data)return dataURLtoBlob(ph.data);const r=await phGet(ph.id);return r&&r.blob||null;}
function photoLists(p){const out=[];(p.rooms||[]).forEach(r=>{out.push(r);(r.fenster||[]).forEach(f=>{out.push(f);(f.verglasungen||[]).forEach(v=>out.push(v));});});return out.filter(o=>Array.isArray(o.photos));}
// Foto-IDs in einem Projekt/Raum/Fenster/Verglasungs-Teilbaum (nur Store-Fotos)
function photoIdsIn(o){const s=[];const walk=x=>{if(!x)return;(x.photos||[]).forEach(ph=>{if(ph&&!ph.data)s.push(ph.id);});(x.docs||[]).forEach(d=>{if(d&&d.photoId)s.push(d.photoId);});(x.rooms||[]).forEach(walk);(x.fenster||[]).forEach(walk);(x.verglasungen||[]).forEach(walk);};walk(o);return s;}
const legacyCount=p=>photoLists(p).reduce((s,o)=>s+o.photos.filter(ph=>ph&&ph.data).length,0);
async function migratePhotos(p,onStep){for(const o of photoLists(p)){const out=[];for(const ph of o.photos){if(ph&&ph.data){try{out.push(await storeExistingPhoto(ph,ph.data));}catch(e){out.push(ph);}onStep&&onStep();}else out.push(ph);}o.photos=out;}}
// Nicht mehr referenzierte Bild-Blobs entfernen (z.B. nach Löschen von Räumen/Fenstern)
async function gcPhotos(projects){try{const used=new Set();projects.forEach(p=>photoIdsIn(p).forEach(id=>used.add(id)));const keys=await phKeys();await phDel(keys.filter(k=>!used.has(k)));}catch(e){}}

// Gebäudeteile (Trakte): Reihenfolge aus p.trakte, ergänzt um Namen, die nur an Räumen stehen
function traktList(p){const t=[...((p&&p.trakte)||[])];((p&&p.rooms)||[]).forEach(r=>{if(r.trakt&&!t.includes(r.trakt))t.push(r.trakt);});((p&&p.docs)||[]).forEach(d=>{if(d.trakt&&!t.includes(d.trakt))t.push(d.trakt);});return t;}
// Räume für Export sortiert: Gebäudeteil → Geschoss (Reihenfolge wie in der App) → Erfassungsreihenfolge
function sortedRooms(p){const tl=traktList(p);const ti=r=>{const i=tl.indexOf(r.trakt||"");return i<0?tl.length:i;};const fi=r=>{const i=FLOORS.indexOf(r.geschoss);return i<0?FLOORS.length:i;};
  return (p.rooms||[]).map((r,i)=>({r,i})).sort((a,b)=>ti(a.r)-ti(b.r)||fi(a.r)-fi(b.r)||a.i-b.i).map(x=>x.r);}
// Dateinamen der Fotos – gemeinsam für ZIP-Export und Excel-Fotoverzeichnis
const fnSafe=s=>String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"_");
function photoEntries(p){const out=[];let n=0;sortedRooms(p).forEach(room=>{const base=(room.trakt?fnSafe(room.trakt)+"_":"")+(fnSafe(room.geschoss)||"x")+"_"+(fnSafe(room.raumnummer||room.raumId)||"Raum");
  (room.photos||[]).forEach(ph=>{n++;out.push({ph,n,ebene:"Raum",room,fen:null,vg:null,typ:"Raum",name:`${base}_Raum_${n}.jpg`});});
  (room.fenster||[]).forEach(fen=>{(fen.photos||[]).forEach(ph=>{n++;out.push({ph,n,ebene:"Fenster",room,fen,vg:null,typ:"Fenster",name:`${base}_${fnSafe(fen.nr)}_${n}.jpg`});});
    (fen.verglasungen||[]).forEach(vg=>{(vg.photos||[]).forEach(ph=>{n++;const fv=`${base}_${fnSafe(fen.nr)}_V${vg.nr}`;
      if(ph.ms&&MS_TYPES[ph.ms]){const T=MS_TYPES[ph.ms],m=(vg.messungen||[]).find(x=>x.id===ph.msId)||null; // Messfoto: Kurzname + Wert im Dateinamen, ohne Einheit („W/m²K" enthält „/")
        out.push({ph,n,ebene:"Verglasung",room,fen,vg,typ:"Messung "+T.label,ms:ph.ms,msId:ph.msId||"",wert:m?msLabel(m):"",name:`${fv}_Mess-${T.short}${m?"-"+fnSafe(String(m.wert)):""}_${n}.jpg`});}
      else{const t=ph.isStempel?"Stempel":"Verglasung";out.push({ph,n,ebene:"Verglasung",room,fen,vg,typ:t,ms:"",msId:"",wert:"",name:`${fv}_${t}_${n}.jpg`});}});});});});return out;}

// Unterlagen (Pläne, Details, Datenblätter …): Seiten als Bild im photos-Store (d.photoId). Grundrisse tragen Punkte
// (room.pos / f.pos = [{docId,x,y}]), Ansichten Fenster-Rechtecke (f.pos = [{docId,x,y,w,h}]); x/y/w/h normiert 0..1 aufs Bild
const DOC_ARTEN={grundriss:{label:"Grundriss",plan:true},ansicht:{label:"Ansicht / Fassade",plan:true},detail:{label:"Detail / Schnitt"},datenblatt:{label:"Datenblatt"},nachweis:{label:"Energienachweis"},sonstiges:{label:"Sonstiges"}};
const DOC_HERKUNFT={pdf:"PDF",bild:"Bild",foto:"Foto",skizze:"Skizze"};
const isPlanDoc=d=>!!(d&&DOC_ARTEN[d.art]&&DOC_ARTEN[d.art].plan);
function docTitle(d){if(!d)return "";if(d.name)return d.name;const a=DOC_ARTEN[d.art]?DOC_ARTEN[d.art].label:"Unterlage";
  return [a,d.trakt,d.art==="ansicht"?(d.fassade?"Fassade "+d.fassade:""):d.geschoss].filter(Boolean).join(" · ");}
// Reihenfolge: Grundrisse (Trakt → Geschoss), Ansichten (Trakt → Fassade), dann übrige Arten; sonst Anlagereihenfolge
function sortedDocs(p){const ar=Object.keys(DOC_ARTEN),tl=traktList(p);const ix=(l,v)=>{const i=l.indexOf(v);return i<0?l.length:i;};
  return ((p&&p.docs)||[]).map((d,i)=>({d,i})).sort((a,b)=>ix(ar,a.d.art)-ix(ar,b.d.art)||ix(tl,a.d.trakt||"")-ix(tl,b.d.trakt||"")||ix(FLOORS,a.d.geschoss)-ix(FLOORS,b.d.geschoss)||ix(ORIENTATIONS,a.d.fassade)-ix(ORIENTATIONS,b.d.fassade)||a.i-b.i).map(x=>x.d);}
const posOn=(o,docId)=>((o&&o.pos)||[]).find(q=>q.docId===docId)||null;
// Verortung setzen (q = {x,y[,w,h]}) bzw. entfernen (q = null); mutiert o
function setPosIn(o,docId,q){const l=(o.pos||[]).filter(x=>x.docId!==docId);if(q)l.push({docId,...q});if(l.length)o.pos=l;else delete o.pos;}
// Unterlage entfernen (mutiert p): Eintrag und alle Verortungen darauf; liefert die Bild-ID zum Löschen
function delDocIn(p,docId){const d=(p.docs||[]).find(x=>x.id===docId);p.docs=(p.docs||[]).filter(x=>x.id!==docId);
  (p.rooms||[]).forEach(r=>{setPosIn(r,docId,null);(r.fenster||[]).forEach(f=>setPosIn(f,docId,null));});return (d&&d.photoId)||null;}
// Dateinamen der Unterlagen in der ZIP (Ordner «unterlagen»), nummeriert in Anzeige-Reihenfolge
function docEntries(p){return sortedDocs(p).map((d,i)=>({doc:d,name:`${String(i+1).padStart(2,"0")}_${fnSafe(docTitle(d).replace(/\s*·\s*/g," "))||"Unterlage"}.jpg`}));}

// Minimaler ZIP-Writer (unkomprimiert): Fotos werden als Blob-Referenzen eingebunden statt in den Speicher kopiert
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,blob);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nm);off+=30+nm.length+sz;i++;onStep&&onStep(i,entries.length);}

// ZIP lesen: unkomprimierte Einträge werden nur als Datei-Ausschnitt referenziert; komprimierte über SheetJS/CFB
async function readZip(file){const tl=Math.min(file.size,65557);const tail=new DataView(await file.slice(file.size-tl).arrayBuffer());let eo=-1;
  for(let i=tl-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){eo=i;break;}}if(eo<0)throw new Error("keine gültige ZIP-Datei");

  for(let k=0;k<n&&p+46<=cdv.byteLength;k++){if(cdv.getUint32(p,true)!==0x02014b50)break;const method=cdv.getUint16(p+10,true),csz=cdv.getUint32(p+20,true),nl=cdv.getUint16(p+28,true),el=cdv.getUint16(p+30,true),cl=cdv.getUint16(p+32,true),lo=cdv.getUint32(p+42,true);

// Projekt-Migration (beim Start und beim Import), liefert true bei Änderung:
// – altes Fensterfeld „Fenstertyp" (eine Öffnungsart je Fenster): ohne Geometrie → Ein-Feld-Geometrie mit dieser Öffnungsart,
//   sonst (Geometrie vorhanden oder „Sonstig") → Bemerkung „Fenstertyp (alt): …"; Feld, Quelle und Standardwert entfernen, activeFields umschreiben
// – Messwerte ohne id erhalten eine (Messfotos verweisen per msId darauf)
const GEO_ARTEN=["Dreh","Kipp","Dreh-Kipp","Fest","Schiebe","Klapp"];
function migrateProj(p){if(!p||!Array.isArray(p.rooms))return false;let ch=false,geoNeu=false;
  const note=(f,txt)=>{const n=f.notizen||"";if(n.includes(txt))return;f.notizen=n?n+"\n"+txt:txt;ch=true;};
  p.rooms.forEach(r=>(r.fenster||[]).forEach(f=>{
    if(f.data&&"fensterTyp" in f.data){const alt=f.data.fensterTyp;
      if(alt){if(GEO_ARTEN.includes(alt)&&!f.geometrie){f.geometrie=geoFromArt(alt);geoNeu=true;}else note(f,"Fenstertyp (alt): "+alt);}
      delete f.data.fensterTyp;ch=true;}
    if(f.sources&&"fensterTyp" in f.sources){delete f.sources.fensterTyp;ch=true;}
    (f.verglasungen||[]).forEach(v=>(v.messungen||[]).forEach(m=>{if(m&&!m.id){m.id=uid();ch=true;}}));}));
  const af=p.activeFields||[];
  if(af.includes("fensterTyp")){p.activeFields=af.map(k=>k==="fensterTyp"?"fensterBauart":k).filter((k,i,a)=>a.indexOf(k)===i);ch=true;}
  if(geoNeu&&!(p.activeFields||[]).includes("geometrie")){p.activeFields=[...(p.activeFields||[]),"geometrie"];ch=true;}
  if(p.defaults&&"fensterTyp" in p.defaults){delete p.defaults.fensterTyp;ch=true;}
  return ch;}
// Projektdatei (ZIP oder JSON, auch alte JSON-Backups mit eingebetteten Fotos) lesen; Fotos landen mit neuen IDs im Store
async function readProjectFile(file){const head=await file.slice(0,2).text();let d,files=null;
  if(head==="PK"){files=await readZip(file);const jf=[...files.keys()].find(k=>/\.json$/i.test(k));if(!jf)throw new Error("ZIP enthält keine Projektdaten");d=JSON.parse(await files.get(jf).text());}
  else d=JSON.parse(await file.text());
  if(!d||!d.id||!Array.isArray(d.rooms))throw new Error("keine FensterCheck-Projektdatei");
  for(const o of photoLists(d)){const out=[];for(const ph of o.photos){try{if(ph.data)out.push(await storeExistingPhoto(ph,ph.data));else if(ph.file&&files&&files.get(ph.file))out.push(await storeExistingPhoto(ph,files.get(ph.file)));}catch(e){}}o.photos=out;}
  // Unterlagen: Bild aus der ZIP mit neuer ID speichern; ohne Bild (JSON) bleibt der Eintrag als «Bild fehlt»
  for(const doc of (d.docs||[])){let m=null;try{if(doc.file&&files&&files.get(doc.file))m=await storeExistingPhoto({},files.get(doc.file));}catch(e){}
    if(m){doc.photoId=m.id;doc.w=m.w;doc.h=m.h;doc.kb=m.kb;}else doc.photoId="";delete doc.file;}
  migrateProj(d);delete d._format;return d;}

// Messungen je Verglasung: mehrere Werte je Messart. Alte Einträge ohne "typ" sind Gasfüllgrad.
const MS_TYPES={
  gas:{label:"Gasfüllgrad",short:"Gas",unit:"%",min:0,max:100},
  ug:{label:"Ug gemessen",short:"Ug",unit:"W/m²K",min:0.2,max:6.5},
  tp:{label:"Taupunkt",short:"TP",unit:"°C",min:-80,max:30,neg:true},

const MS_KEYS=Object.keys(MS_TYPES);
// Gasmessgeräte: der Portable misst auch Glasdicken/SZR und 3-fach-Glas, der Handheld nur 2-fach ohne Aufbau.
// Messwert-Zusätze (nur Gas): geraet (Schlüssel), szr (1|2 bei 3-fach), aufbau («4/16/4», vom Portable)
const GAS_GERAETE={portable:{label:"Sparklike Laser Portable",short:"Portable",aufbau:true,dreifach:true},handheld:{label:"Sparklike Handheld",short:"Handheld",aufbau:false,dreifach:false}};
const aufbauSzr=s=>{const n=String(s||"").split("/").map(x=>x.trim()).filter(Boolean).length;return n>=3&&n%2===1?(n-1)/2:0;};   // Anzahl SZR aus «4/16/4» (1) bzw. «4/12/4/12/4» (2)
const msZusatz=m=>m?[m.geraet&&GAS_GERAETE[m.geraet]?GAS_GERAETE[m.geraet].short:"",m.szr?"SZR "+m.szr:"",m.aufbau||""].filter(Boolean).join(" · "):"";
const msTyp=m=>(m&&m.typ&&MS_TYPES[m.typ])?m.typ:"gas";
const msOf=(v,t)=>((v&&v.messungen)||[]).filter(m=>msTyp(m)===t);
const fmtMs=m=>m?`${m.wert} ${MS_TYPES[msTyp(m)].unit}${m.szr?" (SZR "+m.szr+")":""}`:"";
const msLabel=m=>m?`${MS_TYPES[msTyp(m)].label} ${m.wert} ${MS_TYPES[msTyp(m)].unit}${m.szr?" (SZR "+m.szr+")":""}`:"";   // „Gasfüllgrad 92 %" – Titel im Betrachter und Export
const msPhotos=(v,mId)=>mId?((v&&v.photos)||[]).filter(p=>p.msId===mId):[];             // Messfotos eines Messwerts
const msOrphans=v=>{const ids=new Set(((v&&v.messungen)||[]).map(m=>m.id));return ((v&&v.photos)||[]).filter(p=>p.ms&&!ids.has(p.msId));}; // Messfotos ohne passenden Messwert
// Messprofil: Messarten des Profils (sonst alle), Status «nicht messbar» je Messart (v.msSkip[typ]={grund,zeit})
const profMs=p=>{const pr=profOf(p);return pr&&pr.ms?pr.ms:MS_KEYS;};
const profMess=p=>!!(profOf(p)&&profOf(p).ms);
const NM_GRUENDE=["nicht zugänglich","kein Isolierglas","Gerät misst nicht","Sonstiges"];
const msSkipOf=(v,t)=>(v&&v.msSkip&&v.msSkip[t])||null;
const vgGemessen=(p,v)=>profMs(p).some(t=>msOf(v,t).length>0||!!msSkipOf(v,t));
// «Speichern & weiter»: nächster nicht erledigter Eintrag nach Index i (mit Umlauf), sonst -1
function nextOpen(list,i,done){for(let k=1;k<list.length;k++){const j=(i+k)%list.length;if(!done(list[j]))return j;}return -1;}
function msStats(list){const w=list.map(m=>m.wert).filter(x=>typeof x==="number"&&!isNaN(x));if(!w.length)return null;const s=[...w].sort((a,b)=>a-b);const r=x=>Math.round(x*100)/100;
  return {n:w.length,avg:r(w.reduce((a,b)=>a+b,0)/w.length),min:s[0],max:s[s.length-1],med:r(s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2)};}
// Eine Verglasung gilt als "erfasst", wenn an ihr vor Ort gearbeitet wurde – Messung, Foto oder Daten an der Verglasung,
// Foto oder Rahmenzustand am Fenster. Die Fenster-Daten zählen bewusst NICHT: sie sind oft aus Plänen vorbelegt (Fassade,

const vgErf=(f,v)=>(v?.messungen?.length>0)||((v?.photos||[]).length>0)||Object.values(v?.data||{}).some(x=>x&&(""+x).trim())||((f?.photos||[]).length>0)||!!f?.zustandRahmen;

function exportFieldSet(p){const s=new Set(p.activeFields||[]);const has=x=>x&&(""+x).trim();

function buildExport(p){

  (p.rooms||[]).forEach(r=>{tR++;tP+=(r.photos||[]).length;(r.fenster||[]).forEach(f=>{tF++;tP+=(f.photos||[]).length;(f.verglasungen||[]).forEach(v=>{tV++;(v.messungen||[]).forEach(m=>{tM[msTyp(m)]++;});tP+=(v.photos||[]).length;});});});
  ov.push(["Statistik"],["Räume",tR],["Fenster",tF],["Verglasungen",tV],...MS_KEYS.map(t=>["Messungen "+MS_TYPES[t].label,tM[t]]),["Fotos",tP],[],

  if(p.defaults&&Object.keys(p.defaults).length>0){ov.push([],["Standardwerte"]);Object.entries(p.defaults).forEach(([k,v])=>{if(v&&FIELDS[k])ov.push([FIELDS[k].label,v]);});}

  // Gemeinsame Daten-Spalten (Verglasung, Fenster, Zustand, Geometrie, Maße, Notizen)
  const zOn=(p.zustandModus&&p.zustandModus!=="Keine")||(p.rooms||[]).some(r=>(r.fenster||[]).some(f=>f.zustandRahmen));
  const fHead=[];

  ff.forEach(([k,d])=>{fHead.push(d.label);if(d.src&&p.showSrc)fHead.push(d.label+" [Quelle]");});
  if(zOn)fHead.push("Zustand Rahmen");

    if(zOn)row.push(fen.zustandRahmen||"");

  rooms.forEach(room=>{let fc=0,vc=0,ec=0,mc=0,pc=(room.photos||[]).length;const all={};MS_KEYS.forEach(t=>all[t]=[]);

}

function DInp({value,onCommit,style,type,step,placeholder,multiline,rows}){
  const[loc,setLoc]=useState(value||"");
  const t=useRef(null),lv=useRef(value||""),locR=useRef(loc),cbR=useRef(onCommit);
  locR.current=loc;cbR.current=onCommit;
  useEffect(()=>{if((value||"")!==lv.current){if(t.current){clearTimeout(t.current);t.current=null;}setLoc(value||"");lv.current=value||"";}},[value]);
  const fire=val=>{if(t.current){clearTimeout(t.current);t.current=null;}if(val!==lv.current){lv.current=val;cbR.current(val);}};
  const change=val=>{setLoc(val);if(t.current)clearTimeout(t.current);t.current=setTimeout(()=>fire(val),600);};
  useEffect(()=>()=>{if(t.current){clearTimeout(t.current);if(locR.current!==lv.current){lv.current=locR.current;cbR.current(locR.current);}}},[]);
  if(multiline)return <textarea style={{...style,resize:"vertical",lineHeight:1.4,fontFamily:"inherit",height:"auto"}} rows={rows||2} value={loc} onChange={e=>change(e.target.value)} onBlur={()=>fire(loc)} placeholder={placeholder}/>;
  return <input style={style} type={type||"text"} step={step} value={loc} onChange={e=>change(e.target.value)} onBlur={()=>fire(loc)} placeholder={placeholder}/>;
}

function Thumb({ph,onClick}){

    phGet(ph.id).then(r=>{const b=r&&(r.tblob||r.blob);if(!b)return;const url=URL.createObjectURL(b);thumbCache.set(ph.id,url);if(alive)setU(url);}).catch(()=>{});

// Vollbild-Betrachter: Tippen = Originalgröße (verschiebbar), Wischen/Pfeile = blättern
function PhotoViewer({photos,start,title,onClose,onDel}){
  const[i,setI]=useState(start||0);const[zoom,setZoom]=useState(false);
  const[url,setUrl]=useState(()=>{const q=photos[start||0];return q?(q.data||thumbCache.get(q.id)||null):null;});
  const box=useRef(null),tx=useRef(null),zp=useRef(null);
  const n=photos.length,idx=Math.min(i,Math.max(0,n-1)),ph=photos[idx];
  const go=d=>{if(n>1)setI((idx+d+n)%n);};
  useEffect(()=>{if(!n)onClose();},[n]);
  useEffect(()=>{const o=document.body.style.overflow;document.body.style.overflow="hidden";return()=>{document.body.style.overflow=o;};},[]);
  useEffect(()=>{if(!ph)return;let alive=true,u=null;setZoom(false);setUrl(ph.data||thumbCache.get(ph.id)||null);
    if(!ph.data)phGet(ph.id).then(r=>{if(alive&&r&&r.blob){u=URL.createObjectURL(r.blob);setUrl(u);}}).catch(()=>{});
    return()=>{alive=false;if(u)URL.revokeObjectURL(u);};},[ph&&ph.id]);
  useEffect(()=>{const k=e=>{if(e.key==="Escape")onClose();else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);});
  useEffect(()=>{const b=box.current,img=b&&b.querySelector("img");if(zoom&&img&&zp.current){b.scrollLeft=zp.current.fx*img.offsetWidth-b.clientWidth/2;b.scrollTop=zp.current.fy*img.offsetHeight-b.clientHeight/2;}},[zoom]);
  if(!ph)return null;
  const tap=e=>{if(zoom){setZoom(false);return;}const r=e.currentTarget.getBoundingClientRect();zp.current={fx:(e.clientX-r.left)/r.width,fy:(e.clientY-r.top)/r.height};setZoom(true);};
  const z=new Date(ph.zeit);
  const vb={background:"rgba(20,27,36,0.85)",border:"1px solid rgba(255,255,255,0.2)",color:"#fff",borderRadius:8,padding:"8px 12px",fontSize:15,fontWeight:600,cursor:"pointer",textDecoration:"none",lineHeight:1};
  return ReactDOM.createPortal(<div style={{position:"fixed",inset:0,background:"#000",zIndex:500,display:"flex",flexDirection:"column",color:"#fff"}}>
    <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px",paddingTop:"max(10px, env(safe-area-inset-top))"}}>
      <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:14,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{title||"Foto"} · {idx+1}/{n}</div><div style={{fontSize:11,opacity:0.65}}>{isNaN(z)?"":z.toLocaleString("de-CH")}{ph.w?` · ${ph.w}×${ph.h} px`:""}</div></div>
      {url&&<a href={url} download={`Foto_${idx+1}.jpg`} style={vb}>⬇</a>}
      {onDel&&<button style={vb} onClick={()=>{if(confirm("Foto löschen?"))onDel(ph.id);}}>🗑</button>}
      <button style={vb} onClick={onClose}>✕</button>
    </div>
    <div ref={box} onTouchStart={e=>{if(!zoom)tx.current=e.touches[0].clientX;}} onTouchEnd={e=>{if(zoom||tx.current==null)return;const dx=e.changedTouches[0].clientX-tx.current;tx.current=null;if(Math.abs(dx)>50)go(dx<0?1:-1);}}
      style={{flex:1,minHeight:0,overflow:zoom?"auto":"hidden",display:zoom?"block":"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
      {url?<img src={url} alt="" onClick={tap} style={zoom?{display:"block",width:ph.w||"auto",maxWidth:"none",cursor:"zoom-out"}:{maxWidth:"100%",maxHeight:"100%",objectFit:"contain",cursor:"zoom-in"}}/>:<div style={{opacity:0.6}}>Lädt…</div>}
      {!zoom&&n>1&&<button style={{...vb,position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:22,padding:"10px 14px"}} onClick={()=>go(-1)}>‹</button>}
      {!zoom&&n>1&&<button style={{...vb,position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:22,padding:"10px 14px"}} onClick={()=>go(1)}>›</button>}
    </div>
    <div style={{textAlign:"center",fontSize:11,opacity:0.6,padding:"8px 0",paddingBottom:"max(8px, env(safe-area-inset-bottom))"}}>{zoom?"Ziehen zum Verschieben · Tippen zum Verkleinern":"Tippen = Originalgröße"+(n>1?" · Wischen zum Blättern":"")}</div>
  </div>,document.body);
}

// DIN-Öffnungssymbol je Feld: Dreh = Dreieck-Spitze zur Bandseite (L/R); Kipp = Spitze oben (Band unten), Klapp = Spitze unten (Band oben)
function openingSymbol(cell,x,y,w,h,key,mini){
  const a=cell.art||"",band=geoBandFor(a,cell.band||""),col=C.ac,sw=1.2,m=Math.min(4,w/6,h/6),els=[];if(w<10||h<10)return els;const cx=x+w/2,cy=y+h/2;
  const st=mini?{pointerEvents:"none",vectorEffect:"non-scaling-stroke"}:{pointerEvents:"none"};
  const L=(x1,y1,x2,y2,i)=><line key={key+"_"+i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={col} strokeWidth={sw} style={st}/>;
  const drehL=()=>[L(x+w-m,y+m,x+m,cy,1),L(x+w-m,y+h-m,x+m,cy,2)];
  const drehR=()=>[L(x+m,y+m,x+w-m,cy,1),L(x+m,y+h-m,x+w-m,cy,2)];
  const apexTop=()=>[L(x+m,y+h-m,cx,y+m,3),L(x+w-m,y+h-m,cx,y+m,4)];
  const apexBottom=()=>[L(x+m,y+m,cx,y+h-m,5),L(x+w-m,y+m,cx,y+h-m,6)];
  if(a==="Dreh"||a==="Dreh-Kipp")els.push(...(band==="R"?drehR():drehL()));
  if(a==="Dreh-Kipp")els.push(...apexTop());
  if(a==="Kipp")els.push(...(band==="O"?apexBottom():apexTop()));
  if(a==="Klapp")els.push(...(band==="U"?apexTop():apexBottom()));
  if(a==="Schiebe")els.push(L(x+m,cy,x+w-m,cy,7),L(x+w-m,cy,x+w-m-5,cy-3,8),L(x+w-m,cy,x+w-m-5,cy+3,9));
  return els;
}
// Wiederverwendbare Fensterzeichnung: Editor (interaktiv über sel/onSel), Vorlagen-Kachel (mini) und Messansicht (mini + highlightVg)
function GeoSvg({geo,aspect,sel,onSel,verglasungen,highlightVg,mini}){
  const g=normalizeGeo(geo),a=aspect||GEO_ASPECT_DEF,VW=a>=1?300:Math.round(300*a),VH=a>=1?Math.round(300/a):300,PAD=mini?4:8;
  const vgNr=id=>{const v=(verglasungen||[]).find(x=>x.id===id);return v?v.nr:null;};
  const ns=mini?{vectorEffect:"non-scaling-stroke"}:{};
  const rects=[],seps=[],syms=[],grp=[];
  geoLayout(g.tree,PAD,PAD,VW-2*PAD,VH-2*PAD).forEach(b=>{
    if(b.sep){if(b.sep==="stulp")seps.push(<line key={"s"+b.path} x1={b.x+b.w/2} y1={b.y} x2={b.x+b.w/2} y2={b.y+b.h} stroke={C.tx2} strokeWidth={1} strokeDasharray="5 3" style={{pointerEvents:"none",...ns}}/>);
      else seps.push(<rect key={"s"+b.path} x={b.x} y={b.y} width={b.w} height={b.h} fill={C.tx2} style={{pointerEvents:"none"}}/>);return;}
    const n=b.node;
    if(!b.leaf){if(n.role&&!mini)grp.push(<text key={"g"+b.path} x={b.x+b.w-3} y={b.y+9} textAnchor="end" fill={C.tx3} fontSize="8" style={{pointerEvents:"none"}}>{n.role}</text>);
      if(sel!=null&&sel===b.path)grp.push(<rect key={"q"+b.path} x={b.x+1} y={b.y+1} width={Math.max(0,b.w-2)} height={Math.max(0,b.h-2)} fill="none" stroke={C.ac} strokeWidth={2} strokeDasharray="6 4" style={{pointerEvents:"none"}}/>);return;}
    const hl=(sel!=null&&sel===b.path)||(!!highlightVg&&n.vg===highlightVg),vn=n.vg?vgNr(n.vg):null;
    rects.push(<rect key={"r"+b.path} x={b.x} y={b.y} width={b.w} height={b.h} fill={n.art?C.acBg:C.sf2} stroke={hl?C.ac:C.bd} strokeWidth={hl?2.5:1.4} onClick={onSel?()=>onSel(b.path,n):undefined} style={{cursor:onSel?"pointer":"default",...ns}}/>);
    syms.push(...openingSymbol(n,b.x,b.y,b.w,b.h,b.path,mini));
    if(!mini&&b.w>=28&&b.h>=18){
      if(n.art)syms.push(<text key={"a"+b.path} x={b.x+3} y={b.y+11} fill={C.tx2} fontSize="9" style={{pointerEvents:"none"}}>{FEN_AB[n.art]||""}{n.band?"·"+n.band:""}</text>);
      if(n.role)syms.push(<text key={"o"+b.path} x={b.x+b.w-3} y={b.y+11} textAnchor="end" fill={C.tx3} fontSize="8" style={{pointerEvents:"none"}}>{n.role}</text>);}
    if(vn!=null)syms.push(<text key={"v"+b.path} x={b.x+b.w/2} y={mini?b.y+b.h/2+8:b.y+b.h-5} textAnchor="middle" fill={C.ac} fontSize={mini?22:11} style={{pointerEvents:"none",fontWeight:800}}>V{vn}</text>);
  });
  return <svg viewBox={`0 0 ${VW} ${VH}`} width="100%" style={{height:"auto",maxHeight:mini?140:380,display:"block",margin:"0 auto",touchAction:"manipulation"}}>{rects}{seps}{syms}{grp}<rect x={3} y={3} width={VW-6} height={VH-6} fill="none" stroke={C.tx2} strokeWidth={mini?1.5:4} rx={4} style={{pointerEvents:"none",...ns}}/></svg>;
}
// Fenstergeometrie – Teilungsbaum: Vorlage wählen oder Felder antippen (Öffnungsart, Bandseite, Rolle, Verglasung) und senkrecht/waagrecht teilen
function GeoEditor({geo,onChange,verglasungen,onJump,onSyncVg,aspect}){
  const g=normalizeGeo(geo),vgs=verglasungen||[];
  const[sel,setSel]=useState(null);
  const[showTpl,setShowTpl]=useState(geoIsLeaf(g.tree)&&!g.tree.art&&!g.tree.role&&!g.tree.vg);
  const cur=sel!=null&&geoNode(g,sel)?sel:null,node=cur!=null?geoNode(g,cur):null;   // ungültige Auswahl (Fremdänderung) wirkt wie „nichts gewählt"
  const leaves=geoLeaves(g),a=aspect||GEO_ASPECT_DEF,VW=a>=1?300:Math.round(300*a),VH=a>=1?Math.round(300/a):300;
  const box=cur!=null?geoLayout(g.tree,8,8,VW-16,VH-16).find(b=>b.path===cur):null,depth=cur?cur.split(".").length:0;
  const canSplit=dir=>!!(node&&geoIsLeaf(node)&&depth<GEO_MAX_DEPTH&&box&&(dir==="v"?box.w:box.h)>=24);
  const upd=(ng,nextSel)=>{onChange(ng);if(nextSel!==undefined)setSel(nextSel);};
  const gb={...$.btn,...$.bS,minHeight:36,padding:"6px 10px",fontSize:12};
  const parentPath=cur?geoParentPath(cur):null,parent=cur?geoNode(g,parentPath):null,pidx=cur?geoIdx(cur):0,leafIdx=cur!=null?leaves.findIndex(l=>l.path===cur):-1;
  const stegBtns=(path,val)=>[["pfosten","Pfosten"],["stulp","Stulp"]].map(([k,l])=><button key={k} style={{...gb,...(val===k?$.bP:$.bO)}} onClick={()=>upd(geoSetNode(g,path,{steg:k}))}>{l}</button>);
  return <div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}><span style={$.lbl}>Fensteraufbau</span><button style={{...$.btn,...$.bO,...$.bS,padding:"4px 10px"}} onClick={()=>setShowTpl(x=>!x)}>Vorlagen {showTpl?"▴":"▾"}</button></div>
    {showTpl&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(76px,1fr))",gap:6,marginBottom:8}}>{GEO_TEMPLATES.map(t=><div key={t.id} onClick={()=>{if(geoHasContent(g)&&!confirm("Vorhandene Öffnungsarten und Verglasungs-Zuordnungen werden durch die Vorlage ersetzt. Fortfahren?"))return;upd(t.make(),null);setShowTpl(false);}} style={{border:`1px solid ${C.bd}`,borderRadius:8,padding:4,cursor:"pointer",background:C.sf2,textAlign:"center"}}><GeoSvg mini geo={t.make()} aspect={t.aspect||GEO_ASPECT_DEF}/><div style={{fontSize:9,color:C.tx2,marginTop:2,lineHeight:1.2}}>{t.name}</div></div>)}</div>}
    <div style={{display:"flex",gap:6,marginBottom:6}}>
      <button style={{...gb,...$.bO,flex:1}} onClick={()=>{const ng=geoAddBand(g,true,"Oberlicht");upd(ng,"0");}}>+ Oberlicht</button>
      <button style={{...gb,...$.bO,flex:1}} onClick={()=>{const ng=geoAddBand(g,false,"Brüstung");upd(ng,String(ng.tree.kids.length-1));}}>+ Brüstung</button>
    </div>
    <GeoSvg geo={g} aspect={aspect} sel={cur} onSel={p=>setSel(p)} verglasungen={vgs}/>
    {node?<div style={{padding:8,background:C.sf2,borderRadius:8,margin:"6px 0"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,marginBottom:6}}>
        <span style={{fontSize:11,color:C.tx2}}>{geoIsLeaf(node)?`Feld ${leafIdx+1}/${leaves.length}`:`Gruppe (${geoLeaves({tree:node}).length} Felder)`}{parent&&parent.role?` · in ${parent.role}`:""}</span>
        <span style={{display:"flex",gap:4}}>{cur!==""&&<button style={{...gb,...$.bO}} onClick={()=>setSel(parentPath)}>▲ Gruppe</button>}<button style={{...gb,...$.bO}} onClick={()=>setSel(null)}>✕</button></span>
      </div>
      {geoIsLeaf(node)&&<>
        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:6}}>{["",...FEN_TYPEN].map(t=><button key={t||"x"} style={{...gb,flex:"1 1 30%",...((node.art||"")===t?$.bP:$.bO)}} onClick={()=>upd(geoSetLeaf(g,cur,{art:t}))}>{t||"leer"}</button>)}</div>
        {GEO_BANDS[node.art]&&<div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:6}}><span style={{fontSize:11,color:C.tx2}}>Bandseite (Anschlag):</span>{GEO_BANDS[node.art].map(b=><button key={b} style={{...gb,...(node.band===b?$.bP:$.bO)}} onClick={()=>upd(geoSetLeaf(g,cur,{band:b}))}>{BAND_L[b]}</button>)}<button style={{...gb,...(node.band?$.bO:$.bP)}} onClick={()=>upd(geoSetLeaf(g,cur,{band:""}))}>—</button></div>}
        <div style={{display:"flex",gap:4,alignItems:"center",flexWrap:"wrap",marginBottom:6}}><span style={{fontSize:11,color:C.tx2}}>Verglasung:</span>{vgs.map(v=><button key={v.id} style={{...gb,...(node.vg===v.id?$.bP:$.bO)}} onClick={()=>upd(geoSetLeaf(g,cur,{vg:v.id}))}>V{v.nr}</button>)}{node.vg&&<button style={{...gb,...$.bO}} onClick={()=>upd(geoSetLeaf(g,cur,{vg:""}))}>—</button>}{node.vg&&onJump&&<button style={{...gb,...$.bP}} onClick={()=>onJump(node.vg)}>→ öffnen</button>}{!vgs.length&&<span style={{fontSize:10,color:C.tx3}}>keine Verglasungen angelegt</span>}</div>
        <div style={{display:"flex",gap:4,marginBottom:6}}>
          <button style={{...gb,...$.bO,flex:1,opacity:canSplit("v")?1:0.4}} disabled={!canSplit("v")} onClick={()=>upd(geoSplit(g,cur,"v"),geoPath(cur,0))}>⫿ senkrecht teilen</button>
          <button style={{...gb,...$.bO,flex:1,opacity:canSplit("h")?1:0.4}} disabled={!canSplit("h")} onClick={()=>upd(geoSplit(g,cur,"h"),geoPath(cur,0))}>⫗ waagrecht teilen</button>
        </div>
      </>}
      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6}}><span style={{fontSize:11,color:C.tx2}}>Rolle:</span><select style={{...$.sel,...$.selS,flex:1}} value={node.role||""} onChange={e=>upd(geoSetNode(g,cur,{role:e.target.value}))}><option value="">— keine —</option>{ROW_ROLES.map(o=><option key={o}>{o}</option>)}</select></div>
      {parent&&<div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}><span style={{fontSize:11,color:C.tx2}}>Anteil:</span><button style={{...gb,...$.bO}} onClick={()=>upd(geoSetWeight(g,cur,-1))}>−</button><span style={{fontSize:12,minWidth:44,textAlign:"center"}}>{parent.w[pidx]} von {parent.w.reduce((x,y)=>x+y,0)}</span><button style={{...gb,...$.bO}} onClick={()=>upd(geoSetWeight(g,cur,1))}>+</button>
        {parent.dir==="v"&&<><span style={{fontSize:11,color:C.tx2,marginLeft:6}}>Trennung:</span>{stegBtns(parentPath,parent.steg)}</>}</div>}
      {!geoIsLeaf(node)&&node.dir==="v"&&<div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:6}}><span style={{fontSize:11,color:C.tx2}}>Trennung in dieser Gruppe:</span>{stegBtns(cur,node.steg)}</div>}
      {parent&&<button style={{...gb,...$.bO,color:C.err,borderColor:C.err+"60"}} onClick={()=>upd(geoRemove(g,cur),parentPath)}>🗑 {geoIsLeaf(node)?"Feld":"Gruppe"} entfernen</button>}
    </div>
    :<div style={{fontSize:10,color:C.tx3,margin:"6px 0"}}>Vorlage wählen oder Feld antippen → Öffnungsart, Bandseite, Verglasung, teilen</div>}
    {onSyncVg&&(()=>{const fc=leaves.length,lc=leaves.filter(l=>l.node.vg).length;return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:6,marginBottom:6,flexWrap:"wrap"}}><span style={{fontSize:10,color:(vgs.length!==fc)?C.warn:C.tx3}}>Verglasungen: {vgs.length} · Felder: {fc} · verknüpft: {lc}</span><button style={{...$.btn,...$.bO,...$.bS,padding:"4px 8px"}} onClick={onSyncVg}>aus Geometrie übernehmen</button></div>;})()}
    <div style={{display:"flex",flexWrap:"wrap",gap:8,fontSize:10,color:C.tx2}}>{FEN_TYPEN.map(t=><span key={t}><b style={{color:C.tx}}>{FEN_AB[t]}</b> {t}</span>)}</div>
  </div>;
}

// Detaillierte Rahmen-Abmessungen (je Seite + Mittelstege, innen/aussen)
function RahmenMasse({val,onChange}){
  const m=val||{};
  const set=(pos,ia,v)=>{const nm=JSON.parse(JSON.stringify(m));if(!nm[pos])nm[pos]={i:"",a:""};nm[pos][ia]=v;onChange(nm);};
  return <div style={{marginTop:6}}>
    <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1fr",gap:5,fontSize:10,color:C.tx2,marginBottom:3}}><span></span><span style={{textAlign:"center"}}>Innen [mm]</span><span style={{textAlign:"center"}}>Außen [mm]</span></div>
    {RM_POS.map(([k,lbl])=><div key={k} style={{display:"grid",gridTemplateColumns:"1.5fr 1fr 1fr",gap:5,alignItems:"center",marginBottom:4}}>
      <span style={{fontSize:11,color:C.tx2}}>{lbl}</span>
      <DInp style={{...$.inp,...$.inpS,textAlign:"center"}} type="number" value={m[k]?.i||""} onCommit={val=>set(k,"i",val)} placeholder="–"/>
      <DInp style={{...$.inp,...$.inpS,textAlign:"center"}} type="number" value={m[k]?.a||""} onCommit={val=>set(k,"a",val)} placeholder="–"/>
    </div>)}
  </div>;
}

// Editor für thermische Standardwerte (global + Projekt-Override)
function ThermalEditor({tables,onChange}){
  const T=tables;
  const setCell=(cat,row,col,v)=>{const t=JSON.parse(JSON.stringify(T));if(col===null)t[cat][row]=v;else{if(!t[cat][row])t[cat][row]={};t[cat][row][col]=v;}onChange(t);};
  const numIn=(v,onCh,step)=><input style={{...$.inp,...$.inpS,textAlign:"center",padding:"6px 4px"}} type="number" step={step} value={(v===0||v)?v:""} onChange={e=>onCh(e.target.value)}/>;
  const list=(cat,types,step)=>types.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{flex:1,fontSize:12,color:C.tx2}}>{t}</span><div style={{width:90}}>{numIn(T[cat]?.[t],v=>setCell(cat,t,null,v),step)}</div></div>);
  return <div>
    <div style={{fontSize:11,fontWeight:700,color:C.ac,marginBottom:4}}>Uf – Rahmen [W/m²K]</div>
    <div style={{overflowX:"auto"}}><div style={{minWidth:340}}>
      <div style={{display:"grid",gridTemplateColumns:"96px repeat(4,1fr)",gap:4,marginBottom:3}}><span></span>{UF_EPOCHS.map(e=><span key={e} style={{fontSize:10,color:C.tx2,textAlign:"center"}}>{e}</span>)}</div>
      {FRAME_MAT.filter(mm=>mm!=="Unbekannt").map(mm=><div key={mm} style={{display:"grid",gridTemplateColumns:"96px repeat(4,1fr)",gap:4,alignItems:"center",marginBottom:3}}>
        <span style={{fontSize:11,color:C.tx2}}>{mm}</span>
        {UF_EPOCHS.map(e=><div key={e}>{numIn(T.uf?.[mm]?.[e],v=>setCell("uf",mm,e,v),"0.01")}</div>)}
      </div>)}
    </div></div>
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>Ug – Glas [W/m²K]</div>{list("ug",GLAZ_TYPES.filter(t=>t!=="Unbekannt"),"0.01")}
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>g-Wert</div>{list("g",GLAZ_TYPES.filter(t=>t!=="Unbekannt"),"0.01")}
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>ψ – Randverbund [W/mK]</div>{list("psi",RV_TYPES.filter(t=>t!=="Unbekannt"),"0.001")}
  </div>;
}

// Main App
function App(){

  const[room,setRoom]=useState(null);

  const[fmR,setFmR]=useState({geschoss:"EG",raumnummer:"",raumId:""});
  const[fmF,setFmF]=useState({nr:"",va:2});
  const[impTxt,setImpTxt]=useState("");
  const[loading,setLoading]=useState(true);
  const[collapsed,setCollapsed]=useState({}); // floor collapse state

  const[dupFenId,setDupFenId]=useState(null); // Ziel-Fenster beim Duplizieren
  const[msT,setMsT]=useState("gas"); // aktive Messart im Ziffernblock (bleibt beim Blättern erhalten)
  const[showAll,setShowAll]=useState(false); // Messprofil: Raumansicht mit allen Fensterangaben statt kompakter Liste
  const[aufIn,setAufIn]=useState(null);    // Gasmessung: Aufbau vom Gerät (null = Vorschlag unverändert)
  const[szrSel,setSzrSel]=useState(1);      // Gasmessung 3-fach: gewählter SZR
  const[lastAuf,setLastAuf]=useState(null); // zuletzt gemessener Aufbau {aufbau,von} – Vorschlag für gleiche Verglasungen
  const[bootMsg,setBootMsg]=useState(""); // Fortschritt beim Start (Foto-Migration)
  const[bootErr,setBootErr]=useState(null);
  const[busyMsg,setBusyMsg]=useState(""); // länger laufende Aktionen (ZIP, Import)
  const[storInfo,setStorInfo]=useState(null);
  const[edR,setEdR]=useState(null); // Raum bearbeiten {geschoss,raumnummer,raumId,trakt}
  const[newTrakt,setNewTrakt]=useState("");

  // Start: Projekte laden, alte eingebettete Fotos in den Foto-Store verschieben, verwaiste Bilder entfernen.
  // Die Oberfläche bleibt bis dahin gesperrt, damit keine Bearbeitung mit der Migration kollidiert.
  useEffect(()=>{(async()=>{try{
    const d=(await dbAll())||[];const todo=d.filter(p=>legacyCount(p)>0);const total=todo.reduce((s,p)=>s+legacyCount(p),0);let done=0;
    for(const p of todo){await migratePhotos(p,()=>{done++;setBootMsg(`Fotos werden umgestellt… ${done}/${total}`);});await dbPut(p);}
    for(const p of d){if(migrateProj(p))await dbPut(p);} // Datenmodell nachziehen (z.B. Messwert-IDs)

  }catch(e){console.error(e);setBootErr(e&&e.message||String(e));}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}})();},[]);
  useEffect(()=>{if(view!=="settings"||!navigator.storage||!navigator.storage.estimate)return;
    Promise.all([navigator.storage.estimate(),navigator.storage.persisted?navigator.storage.persisted():Promise.resolve(null)]).then(([e,per])=>setStorInfo({used:e.usage||0,quota:e.quota||0,per})).catch(()=>{});},[view]);

  if(view==="home")return <div className="app" style={$.app}><div style={$.hdr}><div style={{flex:1}}><div style={{fontSize:19,fontWeight:800}}>🔍 FensterCheck</div><div style={{fontSize:10,color:C.tx2,letterSpacing:"0.5px"}}>FENSTERERFASSUNG</div></div><button style={$.hdrB} onClick={()=>setView("info")}>ℹ️</button><button style={$.hdrB} onClick={()=>setView("settings")}>⚙</button></div><div className="body" style={$.body}>
    {projects.length>0&&projects.map(p=>{const s=pSt(p);return <div key={p.id} style={$.li} onClick={()=>{setProj(p);setView("survey");}}><div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,marginBottom:2}}>{p.name||"Unbenannt"}</div><div style={{fontSize:12,color:C.tx2}}>{p.gebaeude||"—"} · {s.rooms}R · {s.m}M</div></div><div style={{display:"flex",gap:6,alignItems:"center"}}><button style={{...$.btn,...$.bO,...$.bS,padding:"5px 8px"}} onClick={e=>{e.stopPropagation();setProj(p);setView("setup");}}>⚙</button><span style={{color:C.tx3}}>›</span></div></div>;})}
    <button style={{...$.btn,...$.bP,...$.bBl,marginTop:16}} onClick={createProj}>+ Neues Projekt</button>
    <label style={{...$.btn,...$.bO,...$.bBl,marginTop:8,cursor:"pointer"}}>
      📂 Projekt importieren (ZIP oder JSON)
      <input type="file" accept=".zip,.json,application/zip,application/json" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];e.target.value="";impFile(f,false);}}/>

  </div>{Toast}</div>;

  // GLOBALE EINSTELLUNGEN
  if(view==="settings")return <div className="app" style={$.app}><div style={$.hdr}><button style={$.hdrB} onClick={()=>setView("home")}>← Zurück</button><div style={$.hdrT}>Einstellungen</div></div><div className="body" style={$.body}>
    <div style={$.card}><div style={$.cardT}>Speicher auf diesem Gerät</div>
      {storInfo?<div style={{fontSize:13,lineHeight:1.6}}>Belegt: <b>{(storInfo.used/1048576).toFixed(1)} MB</b>{storInfo.quota?<> von ca. {(storInfo.quota/1073741824).toFixed(1)} GB</>:null}<br/>Dauerhaft gesichert: <b style={{color:storInfo.per?C.ok:C.warn}}>{storInfo.per===null?"unbekannt":storInfo.per?"ja":"nein"}</b></div>:<div style={{fontSize:12,color:C.tx2}}>Keine Angaben verfügbar.</div>}
      <div style={{fontSize:11,color:C.tx2,marginTop:6,lineHeight:1.5}}>Fotos werden in {PH_MAX} px Auflösung gespeichert. iPhone/iPad: App über „Teilen → Zum Home-Bildschirm" installieren – sonst kann Safari Daten nach 7 Tagen ohne Nutzung löschen. Regelmässig eine ZIP-Sicherung erstellen.</div>
    </div>
    <div style={$.card}><div style={$.cardT}>Standardwerte (Thermisch) – Global</div>

      <ThermalEditor tables={globalTD} onChange={t=>{saveGlobalTD(t);setGlobalTD(t);}}/>
      <button style={{...$.btn,...$.bO,...$.bS,marginTop:12}} onClick={()=>{if(confirm("Alle thermischen Standardwerte auf Werkseinstellung zurücksetzen?")){const t=JSON.parse(JSON.stringify(DEFAULT_TABLES));saveGlobalTD(t);setGlobalTD(t);flash("Zurückgesetzt");}}}>Auf Standardwerte zurücksetzen</button>
    </div>
  </div>{Toast}</div>;

  // INFO / ÜBER
  if(view==="info")return <div className="app" style={$.app}><div style={$.hdr}><button style={$.hdrB} onClick={()=>setView("home")}>← Zurück</button><div style={$.hdrT}>Info & Anleitung</div></div><div className="body" style={$.body}>
    <div style={$.card}><div style={$.cardT}>Über FensterCheck</div>
      <div style={{fontSize:13,lineHeight:1.5}}>Mobile App zur systematischen Erfassung von Fenstern bei Gebäudebegehungen – Geometrie, Rahmen, Verglasung, thermische Kennwerte (Uf/Ug/g/ψ), Zustand und Fotos. Läuft als installierbare PWA und vollständig offline auf dem Gerät.</div>
      <div style={{fontSize:11,color:C.tx2,marginTop:8}}>Version {APP_VERSION} · Entwickelt am INEB FHNW</div>
    </div>
    <div style={$.card}><div style={$.cardT}>Kurzanleitung</div>
      <ol style={{margin:0,paddingLeft:18,fontSize:13,lineHeight:1.55}}>
        <li><b>Projekt</b> anlegen; in <b>Einrichtung</b> Name, Begehung (Begeher, Wetter, Temperaturen) und <b>Erfassungsprofil</b> wählen: Kurzaufnahme, Aufnahme, Detailaufnahme – oder für Messbegehungen Gasfüllgrad, Taupunkt, Ug-Messung. Messprofile zeigen nur ihre Messart, eine kompakte Raumliste und den Fortschritt «gemessen»; «Speichern &amp; weiter» springt zur nächsten offenen Verglasung, «nicht messbar» hält den Grund fest. Das Profil lässt sich vor jeder Begehung umschalten, Daten bleiben erhalten. <b>Gasfüllgrad:</b> Gerät wählen (Sparklike Laser Portable oder Handheld); beim Portable wird der gemessene Aufbau mitgespeichert und als Scheibenaufbau übernommen – vorgeschlagen wird der Wert der Verglasung bzw. der zuletzt gemessene; bei 3-fach-Glas je SZR ein Wert.</li>
        <li>Optional <b>Gebäudeteile/Trakte</b> in der Einrichtung anlegen. <b>Räume</b> anlegen oder per CSV importieren; gleichartige Räume mit <b>⧉</b> duplizieren, mit <b>✎</b> umbenennen.</li>
        <li><b>Fenster</b> hinzufügen (gleichartige mit <b>⧉</b> duplizieren) und von oben nach unten erfassen: Übersichtsfoto, Lage & Aufbau (Fassade, Bauart, <b>Geometrie</b>: Vorlage wählen, Felder antippen → Öffnungsart, Bandseite, Verglasung; senkrecht/waagrecht teilen, Oberlicht/Brüstung ergänzen), Rahmen, Funktion & Zustand, Kennwerte, Bemerkungen.</li>
        <li><b>Verglasung</b> öffnen → Glasstempel (Foto + Text), Aufbau, Fotos, optional <b>Messungen</b> (Gasfüllgrad, Ug gemessen, Taupunkt – beliebig viele Werte; je Wert ein 📷 z.B. für das Display des Messgeräts), Kennwerte (Ug/g/ψ mit Standardwerten), Bemerkungen. <b>Fotos</b>: 📷 Kamera / 🖼️ Galerie; antippen zum Vergrößern.</li>
        <li><b>Thermische Standardwerte</b> global oder pro Projekt unter <b>⚙ Einstellungen</b> anpassen.</li>
        <li><b>Export</b> als Excel/CSV; <b>Sicherung</b> als ZIP (Daten + Fotos) oder JSON (nur Daten).</li>
      </ol>
    </div>
    <div style={$.card}><div style={$.cardT}>Daten & Datenschutz</div>
      <div style={{fontSize:13,lineHeight:1.5}}>Alle Daten bleiben <b>lokal auf dem Gerät</b> (IndexedDB/localStorage); es findet <b>keine Übertragung an einen Server</b> statt. Bitte regelmässig eine ZIP-Sicherung erstellen – beim Löschen der Browserdaten gehen die Erfassungen sonst verloren. Auf dem iPhone die App zum Home-Bildschirm hinzufügen, damit Safari die Daten nicht nach 7 Tagen ohne Nutzung entfernt. Die App ist für Suchmaschinen ausgeblendet (noindex) und nur per Link erreichbar.</div>
    </div>
    <div style={$.card}><div style={$.cardT}>Installation & Hilfe</div>
      <div style={{fontSize:13,lineHeight:1.55}}>
        <b>Android (Chrome):</b> Menü ⋮ → „App installieren" bzw. „Zum Startbildschirm hinzufügen".<br/>
        <b>iPhone/iPad (Safari, nicht Chrome):</b> Teilen ⬆ → „Zum Home-Bildschirm" → „Hinzufügen".<br/>
        <b>Offline:</b> Nach dem ersten Aufruf mit Internet läuft die App vollständig offline (Erfassen, Fotos, Export). Updates werden beim Öffnen im Hintergrund geladen und sind beim nächsten Öffnen aktiv.<br/>
        <b>Mehrere Geräte:</b> ZIP-Sicherung (oder „Nur Daten (JSON)") per AirDrop/E-Mail teilen und auf dem anderen Gerät unter Einrichtung → „Räume zusammenführen" importieren.<br/>
        <b>Fehlerbehebung:</b> Daten verschwunden → Browserdaten wurden gelöscht, Sicherung importieren. Fotos werden nicht gespeichert → Kamerazugriff im Browser erlauben. Excel-Export geht nicht → einmal mit Internet öffnen oder CSV verwenden.
      </div>
    </div>
    <div style={$.card}><div style={$.cardT}>Impressum</div>
      <div style={{fontSize:13,lineHeight:1.5}}>Fachhochschule Nordwestschweiz (FHNW)<br/>Institut für Energie am Bau (INEB)<br/>Kontakt: <a href="mailto:gregor.steinke@fhnw.ch" style={{color:C.ac}}>gregor.steinke@fhnw.ch</a></div>
    </div>
    <div style={$.card}><div style={$.cardT}>Lizenz</div>
      <div style={{fontSize:13,lineHeight:1.5}}>© 2026 FHNW – Institut für Energie am Bau (INEB). Internes Werkzeug, alle Rechte vorbehalten. Nutzung und Weitergabe nur mit Zustimmung des INEB.</div>
    </div>
    <div style={$.card}><div style={$.cardT}>Quellcode</div>
      <div style={{fontSize:13,lineHeight:1.5}}><a href={APP_REPO} target="_blank" rel="noopener noreferrer" style={{color:C.ac}}>github.com/ReSolRe/FensterCheck</a><div style={{fontSize:11,color:C.tx2,marginTop:6}}>Erstellt mit Unterstützung von Claude (Anthropic).</div></div>
    </div>
  </div>{Toast}</div>;

  // SETUP
  if(view==="setup"){const p=proj;const af=new Set(p.activeFields||[]);const defs=p.defaults||{};
    const togF=k=>{const n=new Set(af);if(n.has(k))n.delete(k);else n.add(k);setProj({...p,activeFields:[...n]});};
    const setDef=(k,v)=>{const nd={...defs,[k]:v};setProj({...p,defaults:nd});};
    const trySetModus=(m)=>{
      if(m===p.modus)return;
      if(hasData(p)){flash("⚠ Moduswechsel bei vorhandenen Daten nicht möglich. Neues Projekt erstellen.");return;}
      setProj({...p,modus:m});
    };
  return <div className="app" style={$.app}><div style={$.hdr}><button style={$.hdrB} onClick={()=>setView(p.rooms?.length?"survey":"home")}>← Zurück</button><div style={$.hdrT}>Einrichtung</div><button style={$.hdrB} onClick={()=>{save(p);setView("survey");flash("✓");}}>Fertig</button></div><div className="body" style={$.body}>
    <div style={$.card}><div style={$.cardT}>Projekt</div><div style={{marginBottom:8}}><label style={$.lbl}>Name</label><input style={$.inp} value={p.name||""} onChange={e=>setProj({...p,name:e.target.value})} placeholder="Projektname"/></div><div style={{marginBottom:8}}><label style={$.lbl}>Gebäude</label><input style={$.inp} value={p.gebaeude||""} onChange={e=>setProj({...p,gebaeude:e.target.value})}/></div><div><label style={$.lbl}>Adresse</label><input style={$.inp} value={p.adresse||""} onChange={e=>setProj({...p,adresse:e.target.value})}/></div></div>
    <div style={$.card}><div style={$.cardT}>Begehung</div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <div style={{flex:2}}><label style={$.lbl}>Begeher/in</label><input style={$.inp} value={p.begeher||""} onChange={e=>setProj({...p,begeher:e.target.value})} placeholder="Name"/></div>
        <div style={{flex:1.2}}><label style={$.lbl}>Datum</label><input style={$.inp} type="date" value={p.begehungsdatum||""} onChange={e=>setProj({...p,begehungsdatum:e.target.value})}/></div>
      </div>
      <div style={{marginBottom:8}}><label style={$.lbl}>Witterung</label><input style={$.inp} value={p.witterung||""} onChange={e=>setProj({...p,witterung:e.target.value})} placeholder="z.B. bedeckt, trocken"/></div>
      <div style={{display:"flex",gap:8,marginBottom:8}}>
        <div style={{flex:1}}><label style={$.lbl}>Temp. außen [°C]</label><input style={$.inp} type="number" step="0.5" value={p.tempAussen||""} onChange={e=>setProj({...p,tempAussen:e.target.value})}/></div>
        <div style={{flex:1}}><label style={$.lbl}>Temp. innen [°C]</label><input style={$.inp} type="number" step="0.5" value={p.tempInnen||""} onChange={e=>setProj({...p,tempInnen:e.target.value})}/></div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <div style={{flex:1}}><label style={$.lbl}>Feuchte außen [%rF]</label><input style={$.inp} type="number" value={p.feuchteAussen||""} onChange={e=>setProj({...p,feuchteAussen:e.target.value})}/></div>
        <div style={{flex:1}}><label style={$.lbl}>Feuchte innen [%rF]</label><input style={$.inp} type="number" value={p.feuchteInnen||""} onChange={e=>setProj({...p,feuchteInnen:e.target.value})}/></div>
      </div>
    </div>
    <div style={$.card}><div style={$.cardT}>Erfassungsprofil{profCustom(p)&&<span style={{textTransform:"none",fontWeight:400,color:C.warn,letterSpacing:0}}> · angepasst</span>}</div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:8}}>Voreinstellung für die Begehung: setzt Felder, Zustand Rahmen und Datenquelle (danach anpassbar). Messprofile zeigen nur ihre Messart, die Messkarte zuerst, eine kompakte Raumliste und den Fortschritt «gemessen». Vorhandene Daten bleiben erhalten.{!profOf(p)&&<span style={{color:C.warn}}> Noch kein Profil gewählt – es gilt die eigene Feldauswahl.</span>}</div>
      {["Aufnahme","Messung"].map(grp=><div key={grp} style={{marginBottom:8}}><div style={{fontSize:11,fontWeight:700,color:C.ac,marginBottom:4}}>{grp.toUpperCase()}</div><div style={{display:"flex",gap:6}}>{Object.entries(PROFILES).filter(([,pr])=>pr.grp===grp).map(([k,pr])=><button key={k} style={{...$.btn,...(p.profil===k?$.bP:$.bO),...$.bS,flex:1,flexDirection:"column",padding:"8px 4px",height:"auto"}} onClick={()=>{setProj(applyProfile(p,k));flash(`Profil «${pr.name}»`);}}><span style={{fontWeight:700,fontSize:12}}>{pr.name}</span><span style={{fontSize:9,opacity:0.8}}>{pr.desc}</span></button>)}</div></div>)}
      <Sec title="Felder anpassen" collapsed summary={`${af.size} von ${Object.keys(FIELDS).length} Feldern aktiv`}>
      {["f","v"].map(g=><div key={g}><div style={{fontSize:11,fontWeight:700,color:C.ac,marginBottom:4,marginTop:g==="v"?12:0}}>{g==="f"?"FENSTER":"VERGLASUNG"}</div>
        {SECTIONS.filter(sc=>sc.g===g).map(sc=><div key={sc.id}><div style={{...$.lbl,marginTop:6,color:C.tx3}}>{sc.title}</div>{secFields(sc.id).map(([k,d])=><Tog key={k} label={`${d.label}${d.src?" ᴹᴴᴾ":""}`} value={af.has(k)} onChange={()=>togF(k)}/>)}</div>)}</div>)}</Sec></div>
    <div style={$.card}><div style={$.cardT}>Gebäudeteile / Trakte</div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:8}}>Optional: Ebene über Geschoss und Raum, z.B. „Schulhaus", „Turnhalle", „Trakt A". Räume werden in der Raumliste danach gruppiert.</div>
      {traktList(p).map((t,i,a)=>{const cnt=(p.rooms||[]).filter(r=>r.trakt===t).length;return <div key={t} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 0",borderBottom:`1px solid ${C.bd}`}}>
        <span style={{flex:1,fontWeight:600,fontSize:14}}>🏢 {t} <span style={{fontSize:11,color:C.tx3,fontWeight:400}}>· {cnt} {cnt===1?"Raum":"Räume"}</span></span>
        <button style={{...$.btn,...$.bO,...$.bS,padding:"4px 8px",opacity:i?1:0.3}} disabled={!i} onClick={()=>moveTrakt(t,-1)}>↑</button>
        <button style={{...$.btn,...$.bO,...$.bS,padding:"4px 8px",opacity:i<a.length-1?1:0.3}} disabled={i>=a.length-1} onClick={()=>moveTrakt(t,1)}>↓</button>
        <button style={{...$.btn,...$.bO,...$.bS,padding:"4px 8px"}} onClick={()=>{const n=prompt("Gebäudeteil umbenennen",t);if(n!=null)renTrakt(t,n);}}>✎</button>
        <button style={{...$.btn,...$.bO,...$.bS,padding:"4px 8px",color:C.err}} onClick={()=>delTrakt(t)}>🗑</button></div>;})}
      <div style={{display:"flex",gap:6,marginTop:8}}><input style={{...$.inp,...$.inpS}} value={newTrakt} onChange={e=>setNewTrakt(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){addTrakt(newTrakt);setNewTrakt("");}}} placeholder="Neuer Gebäudeteil"/><button style={{...$.btn,...$.bP,...$.bS}} onClick={()=>{addTrakt(newTrakt);setNewTrakt("");}}>+</button></div>
    </div>
    <div style={$.card}><div style={$.cardT}>Optionen</div><Tog label="Datenquelle erfassen (M/H/P)" value={!!p.showSrc} onChange={v=>setProj({...p,showSrc:v})}/><div style={{fontSize:11,color:C.tx2,marginTop:2}}>Blendet die Quelle-Auswahl (Messwert/Hersteller/Planung) je Wert ein.</div></div>
    <div style={$.card}><div style={$.cardT}>Modus</div>{hasData(p)&&<div style={{fontSize:11,color:C.warn,marginBottom:6}}>⚠ Modus kann nicht geändert werden, da bereits Messdaten vorhanden sind.</div>}<div style={{fontSize:11,color:C.tx2,marginBottom:6}}>Standard: „Fenster + Verglasung" (mit Geometrie & Rahmen). „Nur Verglasungen" nur für reine Glaserfassung ohne Fensterdaten.</div><div style={{display:"flex",gap:8}}>{[["fenster","⊞","Fenster + Verglasung"],["verglasung","◻","Nur Verglasungen"]].map(([m,i,t])=><div key={m} onClick={()=>trySetModus(m)} style={{flex:1,padding:10,borderRadius:8,border:`2px solid ${p.modus===m?C.ac:C.bd}`,background:p.modus===m?C.acBg:"transparent",cursor:"pointer",textAlign:"center",opacity:hasData(p)&&p.modus!==m?0.4:1}}><div style={{fontSize:22}}>{i}</div><div style={{fontWeight:700,fontSize:12,marginTop:2}}>{t}</div></div>)}</div></div>
    <div style={$.card}><div style={$.cardT}>Zustand Rahmen</div><div style={{display:"flex",gap:4}}>{["Keine","Einfach","Freitext","Detailliert"].map(z=><div key={z} onClick={()=>setProj({...p,zustandModus:z})} style={{flex:1,padding:"7px 2px",borderRadius:6,border:`1px solid ${(p.zustandModus||"Keine")===z?C.ac:C.bd}`,background:(p.zustandModus||"Keine")===z?C.acBg:"transparent",cursor:"pointer",textAlign:"center",fontSize:11,fontWeight:600}}>{z}</div>)}</div></div>
    {/* Project Defaults */}
    <div style={$.card}><div style={$.cardT}>Standardwerte (Projekt)</div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:8}}>Diese Werte werden als Vorbelegung für alle neuen Einträge verwendet und können pro Fenster/Verglasung überschrieben werden.</div>
      {DEFAULTABLE_FIELDS.filter(k=>af.has(k)).map(k=>{const d=FIELDS[k];if(!d)return null;
        return <div key={k} style={{marginBottom:8}}>
          <label style={$.lbl}>{d.label}</label>
          {d.t==="select"?<select style={{...$.sel,...$.selS}} value={defs[k]||""} onChange={e=>setDef(k,e.target.value)}><option value="">— Kein Standard —</option>{d.o.map(o=><option key={o}>{o}</option>)}</select>
          :<input style={{...$.inp,...$.inpS}} type={d.t==="number"?"number":"text"} step={d.step||undefined} value={defs[k]||""} onChange={e=>setDef(k,e.target.value)} placeholder={d.ph||"Standardwert"}/>}
        </div>;
      })}
    </div>

    <div style={$.card}><div style={$.cardT}>Standardwerte (Thermisch) – Projekt</div>
      <Tog label="Für dieses Projekt eigene Werte" value={!!p.thermalDefaults} onChange={on=>{if(on)setProj({...p,thermalDefaults:JSON.parse(JSON.stringify(effTD(p)))});else{const{thermalDefaults,...rest}=p;setProj(rest);}}}/>
      {p.thermalDefaults?<div style={{marginTop:8}}><ThermalEditor tables={p.thermalDefaults} onChange={t=>setProj({...p,thermalDefaults:t})}/></div>
      :<div style={{fontSize:11,color:C.tx2,marginTop:4}}>Nutzt die globalen Werte aus den Einstellungen (⚙ auf der Startseite).</div>}
    </div>

    <div style={$.card}><div style={$.cardT}>Raumimport (CSV)</div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:4}}>Pflicht: <b>geschoss</b>, <b>raumnummer</b> (opt. <b>raumid</b>)</div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:6}}>Optional: <b>gebaeudeteil</b>, <b>verglasungen</b>, <b>fenster</b>, <b>verglasungen_je_fenster</b>, <b>fenster_nr</b></div>
      <div style={{display:"flex",gap:6,marginBottom:6}}>
        <label style={{...$.btn,...$.bO,...$.bS,flex:1,cursor:"pointer"}}>
          📂 CSV-Datei auswählen
          <input type="file" accept=".csv,.txt,.tsv" style={{display:"none"}} onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>setImpTxt(ev.target.result);r.readAsText(f);e.target.value="";}}/>
        </label>
      </div>
      {impTxt&&(()=>{
        const parsed=parseCSV(impTxt);const cols=impTxt.trim().split(/\r?\n/)[0]?.split(/[;,\t]/).map(h=>h.trim().toLowerCase())||[];
        const hasFen=cols.some(c=>["fenster","anzahl_fenster","windows"].includes(c));
        const hasVg=cols.some(c=>["verglasungen","anzahl_verglasungen","glazings"].includes(c));
        const hasVgJe=cols.some(c=>["verglasungen_je_fenster","vg_je_fenster","glazings_per_window"].includes(c));
        const hasFenNr=cols.some(c=>["fenster_nr","fensternr","window_nr"].includes(c));
        const nRooms=hasFenNr?new Set(parsed.map(r=>`${r.geschoss||""}|${r.raumnummer||r.room||""}`)).size:parsed.length;
        const nWindows=hasFenNr?parsed.length:0;
        return <div style={{background:C.sf2,borderRadius:8,padding:8,marginBottom:6,fontSize:11}}>
          <div style={{color:C.ok,fontWeight:700,marginBottom:4}}>✓ {nRooms} Räume erkannt{hasFenNr?`, ${nWindows} Fenster`:""}</div>
          <div style={{color:C.tx2}}>Spalten: {cols.join(", ")}</div>
