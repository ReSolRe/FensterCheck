    })}
    {/* Add button */}
    {isV?<button style={{...$.btn,...$.bP,...$.bBl,marginTop:8}} onClick={()=>{addFen(rm.id);flash("Verglasung +");}}>+ Verglasung hinzufügen</button>
    :<button style={{...$.btn,...$.bP,...$.bBl,marginTop:8}} onClick={()=>{setFmF({nr:`F${(rm.fenster?.length||0)+1}`,va:1});setModal("addF");}}>+ Fenster hinzufügen</button>}
  </div>
    {edR&&<div style={$.modal} onClick={()=>setEdR(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Raum bearbeiten</div>
      <TraktPick value={edR.trakt} list={traktList(p)} onChange={v=>setEdR({...edR,trakt:v})}/>
      <div style={{marginBottom:8}}><label style={$.lbl}>Geschoss</label><select style={$.sel} value={edR.geschoss} onChange={e=>setEdR({...edR,geschoss:e.target.value})}>{(FLOORS.includes(edR.geschoss)?FLOORS:[edR.geschoss,...FLOORS]).map(f=><option key={f}>{f}</option>)}</select></div>
      <div style={{marginBottom:8}}><label style={$.lbl}>Raum / Bezeichnung</label><input style={$.inp} value={edR.raumnummer} onChange={e=>setEdR({...edR,raumnummer:e.target.value})}/></div>
      <div style={{marginBottom:14}}><label style={$.lbl}>Raum-ID (optional)</label><input style={$.inp} value={edR.raumId} onChange={e=>setEdR({...edR,raumId:e.target.value})}/></div>
      <button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{if(!edR.raumnummer.trim()&&!edR.raumId.trim()){flash("Raum oder Raum-ID angeben");return;}setRoomProps(rm.id,{trakt:(edR.trakt||"").trim(),geschoss:edR.geschoss,raumnummer:edR.raumnummer.trim(),raumId:edR.raumId.trim()});setEdR(null);flash("Raum gespeichert");}}>Speichern</button></div></div>}
    {modal==="addF"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Fenster hinzufügen</div>
      <div style={{marginBottom:8}}><label style={$.lbl}>Fenster-Nr.</label><input style={$.inp} value={fmF.nr} onChange={e=>setFmF({...fmF,nr:e.target.value})} autoFocus/></div>
      <div style={{marginBottom:6}}><label style={$.lbl}>Verglasungen (Start)</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,6].map(n=><button key={n} style={{...$.btn,flex:1,...((fmF.va||1)===n?$.bP:$.bO)}} onClick={()=>setFmF({...fmF,va:n})}>{n}</button>)}</div></div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:14}}>Verglasungszahl später pro Fenster mit +/− anpassbar oder „aus Geometrie übernehmen". Für mehrere gleiche Fenster: ein Fenster anlegen und mit „⧉ Duplizieren" kopieren.</div>
      <button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{addFen(rm.id,fmF.nr,fmF.va||1);setModal(null);flash("Fenster +");}}>Hinzufügen</button></div></div>}
    {modal==="dupR"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:6}}>Raum duplizieren</div><div style={{fontSize:12,color:C.tx2,marginBottom:12}}>Erzeugt Kopien dieses Raums mit Aufbau, Geometrie und Stammdaten – ohne Messungen und Fotos. Raumnummern danach anpassen.</div><div style={{marginBottom:14}}><label style={$.lbl}>Anzahl Kopien</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,10].map(n=><button key={n} style={{...$.btn,flex:1,...(dupQty===n?$.bP:$.bO)}} onClick={()=>setDupQty(n)}>{n}</button>)}</div></div><button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{dupRoom(rm.id,dupQty);setModal(null);}}>Duplizieren</button></div></div>}
    {modal==="dupF"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:6}}>Fenster duplizieren</div><div style={{fontSize:12,color:C.tx2,marginBottom:12}}>Erzeugt Kopien dieses Fensters mit Daten, Geometrie und Verglasungs-Aufbau – ohne Messungen und Fotos. Zustand und Angaben danach pro Kopie anpassen.</div><div style={{marginBottom:14}}><label style={$.lbl}>Anzahl Kopien</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,10].map(n=><button key={n} style={{...$.btn,flex:1,...(dupQty===n?$.bP:$.bO)}} onClick={()=>setDupQty(n)}>{n}</button>)}</div></div><button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{dupFen(rm.id,dupFenId,dupQty);setModal(null);}}>Duplizieren</button></div></div>}
  {Toast}</div>;}

  // MEASURE
  if(view==="measure"){const p=proj;const rm=p.rooms.find(r=>r.id===room?.id);const f=rm?.fenster?.find(x=>x.id===fen?.id);const v=f?.verglasungen?.find(x=>x.id===vg?.id);
    if(!rm||!f||!v){setView("room");return null;}
    const isV=p.modus==="verglasung";const label=isV?f.nr:`${f.nr} · Verglasung ${v.nr}`;const vf=vFs();
    const mess=profMess(p),msKeys=profMs(p),msTa=msKeys.includes(msT)?msT:msKeys[0];   // Messprofil: nur dessen Messart(en)
    const vfld=([k,d])=><FldInp key={k} k={k} def={d} value={v.data?.[k]||""} source={v.sources?.[k]||""} onVal={val=>setFV(rm.id,f.id,v.id,k,val)} onSrc={sv=>setFS(rm.id,f.id,v.id,k,sv)} defaultVal={getDef(k,f,v)} showSrc={proj?.showSrc}/>;
    let all=[];rm.fenster.forEach(x=>x.verglasungen.forEach(y=>all.push({f:x,v:y})));const idx=all.findIndex(x=>x.v.id===v.id);const tot=all.length;const msd=all.filter(x=>vgDone(p,x.f,x.v)).length;
    const go=i=>{setFen(all[i].f);setVg(all[i].v);setNumVal("");};
    const navTo=(i)=>guardNav(()=>go(i));
    const navBack=()=>guardNav(()=>setView("room"));
    const navRoom=()=>guardNav(()=>{setNumVal("");setView("room");});

    // Add extra verglasung and navigate to it
    const addAndGoExtra=()=>{
      const nf=addExtraVg(rm.id);
      if(nf){setFen(nf);setVg(nf.verglasungen[0]);setNumVal("");}
      flash("Weitere Verglasung +");
    };

    // Messkarte; «Speichern & weiter» springt zur nächsten nicht erledigten Verglasung des Raums
    const weiter=()=>{const j=nextOpen(all,idx,x=>vgDone(p,x.f,x.v));if(j<0){setNumVal("");setView("room");flash("Alle Verglasungen im Raum erledigt ✓");}else go(j);};
    const msCard=()=>{const T=MS_TYPES[msTa];
      // Gas: Gerät (projektweit gemerkt), Aufbau vom Portable (Vorschlag: eigener Wert → zuletzt gemessen → Standard), SZR bei 3-fach
      const isGas=msTa==="gas",gerK=GAS_GERAETE[p.gasGeraet]?p.gasGeraet:"portable",ger=GAS_GERAETE[gerK];
      const eigenAuf=v.data?.scheibenaufbau||"",vorschlag=eigenAuf||(lastAuf&&lastAuf.aufbau)||getDef("scheibenaufbau",f,v)||"";
      const aufWert=aufIn!=null?aufIn:vorschlag;
      const aufHer=aufIn!=null?"":eigenAuf?"Wert dieser Verglasung":(lastAuf&&lastAuf.aufbau)?`zuletzt gemessen (${lastAuf.von})`:vorschlag?"Standardwert":"";
      const dreifach=isGas&&(aufbauSzr(ger.aufbau?aufWert:eigenAuf)===2||(v.data?.verglasungsTyp||getDef("verglasungsTyp",f,v))==="3-fach WSV");
      const szr=dreifach&&ger.dreifach?szrSel:0;
      const kurz=f.nr+((f.verglasungen||[]).length>1?" V"+v.nr:"");
      const speichern=val=>{let e;if(isGas){e={geraet:gerK};if(szr)e.szr=szr;if(ger.aufbau&&aufWert.trim())e.aufbau=aufWert.trim();}
        if(!addMs(rm.id,f.id,v.id,msTa,val,e))return false;if(e&&e.aufbau){setLastAuf({aufbau:e.aufbau,von:kurz});setAufIn(null);}return true;};const ms=v.messungen||[];const groups=MS_KEYS.map(t=>({t,list:ms.filter(m=>msTyp(m)===t)})).filter(g=>g.list.length);const msPh=(v.photos||[]).filter(p=>p.ms).length,orphans=msOrphans(v);
      return <div style={$.card}>
        <div onClick={()=>{if(!mess)setShowGas(g=>!g);}} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,cursor:mess?"default":"pointer"}}>
          <div style={{...$.cardT,marginBottom:0}}>Messungen <span style={{color:C.tx3,fontWeight:400,letterSpacing:0,textTransform:"none"}}>{mess?"· "+profOf(p).name:"· optional"}</span></div>
          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>{groups.map(g=>{const st=msStats(g.list),U=MS_TYPES[g.t];return <span key={g.t} style={{...$.badge,background:C.acBg,color:C.ac,fontFamily:"monospace"}}>{U.short} {st.n>1?"Ø ":""}{st.avg} {U.unit}{st.n>1?` ×${st.n}`:""}</span>;})}{msPh>0&&<span style={{...$.badge,background:C.sf2,color:C.tx2}}>📷 {msPh}</span>}{!mess&&<span style={{fontSize:12,color:C.tx3,transition:"transform 0.2s",transform:showGas?"rotate(0deg)":"rotate(-90deg)"}}>▼</span>}</div>
        </div>
        {(showGas||mess)&&<div style={{marginTop:12}}>
          {msKeys.length>1&&<div style={{display:"flex",gap:4,marginBottom:4}}>{msKeys.map(t=><button key={t} style={{...$.btn,...$.bS,flex:1,padding:"7px 2px",flexDirection:"column",gap:1,...(msTa===t?$.bP:$.bO)}} onClick={()=>{setMsT(t);if(!MS_TYPES[t].neg&&numVal.startsWith("-"))setNumVal(numVal.slice(1));}}><span style={{fontWeight:700}}>{MS_TYPES[t].label}</span><span style={{fontSize:10,opacity:0.8}}>{MS_TYPES[t].unit}</span></button>)}</div>}
          {isGas&&<div style={{marginBottom:8}}>
            <div style={{display:"flex",gap:4,marginBottom:6}}>{Object.entries(GAS_GERAETE).map(([k,g])=><button key={k} style={{...$.btn,...$.bS,flex:1,padding:"6px 2px",fontSize:11,...(gerK===k?$.bP:$.bO)}} onClick={()=>mut(pp=>{pp.gasGeraet=k;})}>{g.label}</button>)}</div>
            {ger.aufbau&&<div style={{marginBottom:6}}><label style={$.lbl}>Aufbau vom Gerät [mm]</label><input style={{...$.inp,...$.inpS}} value={aufWert} onChange={e=>setAufIn(e.target.value)} placeholder="z.B. 4/16/4 oder 4/12/4/12/4"/>{aufHer&&<div style={{fontSize:10,color:C.tx3,marginTop:2}}>Vorschlag: {aufHer} – bei ersetzter Scheibe anpassen</div>}</div>}
            {dreifach&&(ger.dreifach?<div style={{display:"flex",gap:4,marginBottom:2}}>{[1,2].map(n=><button key={n} style={{...$.btn,...$.bS,flex:1,...(szrSel===n?$.bP:$.bO)}} onClick={()=>setSzrSel(n)}>SZR {n}{msOf(v,"gas").some(m=>m.szr===n)?" ✓":""}</button>)}</div>
              :<div style={{fontSize:11,color:C.warn}}>3-fach-Glas: Der Handheld misst nur 2-fach – Portable verwenden oder «Gerät misst nicht» wählen.</div>)}
          </div>}
          <NumPad value={numVal} onChange={setNumVal} unit={T.unit} neg={!!T.neg} onSubmit={val=>{const ok=speichern(val);if(ok&&szr===1)setSzrSel(2);return ok;}} onNext={mess?(val=>{if(!speichern(val))return false;if(szr===1){setSzrSel(2);return;}weiter();}):null} nextLabel={szr===1?"✓ Speichern → SZR 2":null}/>
          <div style={{fontSize:10,color:C.tx3,marginTop:6}}>Beliebig viele Werte je Messart möglich – jeder Wert wird mit Zeitstempel gespeichert. 📷 in der Wertzeile: Foto zum Messwert (z.B. Display des Messgeräts).</div>
          {mess&&(()=>{const sk=msSkipOf(v,msTa);return <div style={{marginTop:10,padding:"8px 10px",borderRadius:7,background:sk?C.warnBg:C.sf2}}>
            {sk?<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}><span style={{fontSize:12,color:C.warn,fontWeight:700}}>Nicht messbar: {sk.grund}</span><button style={{...$.btn,...$.bO,...$.bS,padding:"4px 10px"}} onClick={()=>setSkip(rm.id,f.id,v.id,msTa,null)}>aufheben</button></div>
            :<div><div style={{fontSize:11,color:C.tx2,marginBottom:5}}>Nicht messbar?</div><div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{NM_GRUENDE.map(g=><button key={g} style={{...$.btn,...$.bO,...$.bS,padding:"5px 8px",fontSize:11}} onClick={()=>{setSkip(rm.id,f.id,v.id,msTa,g);flash("Nicht messbar: "+g);}}>{g}</button>)}</div></div>}
          </div>;})()}
          {groups.map(g=>{const st=msStats(g.list),U=MS_TYPES[g.t];return <div key={g.t} style={{marginTop:12}}>
            <div style={{...$.cardT,marginBottom:4}}>{U.label} ({st.n}){st.n>1&&<span style={{textTransform:"none",fontWeight:400,color:C.tx3,letterSpacing:0}}> · Ø {st.avg} · {st.min} bis {st.max} {U.unit}</span>}</div>
            {g.list.map((m,j)=>{const phs=msPhotos(v,m.id);return <div key={m.id||j} style={{padding:"5px 0",borderBottom:j<g.list.length-1?`1px solid ${C.bd}`:"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:6}}>
                <div style={{flex:1,minWidth:0}}><span style={{fontFamily:"monospace",fontWeight:800,fontSize:16}}>{m.wert} {U.unit}</span><span style={{fontSize:10,color:C.tx2,marginLeft:8}}>{new Date(m.zeit).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span>{msZusatz(m)&&<span style={{fontSize:10,color:C.tx3,marginLeft:6}}>{msZusatz(m)}</span>}{phs.length>0&&<span style={{...$.badge,background:C.sf2,color:C.tx2,marginLeft:6,fontSize:10}}>📷 {phs.length}</span>}</div>
                <PhotoBtn small onAdd={ph=>addPh(rm.id,f.id,v.id,{...ph,ms:g.t,msId:m.id})}/>
                <button style={{background:"none",border:"none",color:C.err,cursor:"pointer",fontSize:18,padding:"2px 8px"}} onClick={()=>{if(confirm(`${U.label} ${m.wert} ${U.unit} löschen?`+(phs.length?` ${phs.length} verknüpfte(s) Foto(s) werden mitgelöscht.`:"")))delMs(rm.id,f.id,v.id,m.id);}}>×</button>
              </div>
              <ThumbRow photos={phs} title={msLabel(m)} onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/>
            </div>;})}
          </div>;})}
          {orphans.length>0&&<div style={{marginTop:12}}><div style={{...$.cardT,marginBottom:4}}>Messfotos ohne Wert ({orphans.length})</div><ThumbRow photos={orphans} title="Messfoto ohne Wert" onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/></div>}
        </div>}
      </div>;};
  return <div className="app" style={$.app}><div style={$.hdr}><button style={$.hdrB} onClick={navBack}>← Raum</button><div style={$.hdrT}>{rm.raumnummer} · {label}</div></div><div className="body" style={$.body}>
    <div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.tx2,marginBottom:3}}><span>Verglasung {idx+1}/{tot}</span><span>{msd}/{tot} {mess?"gemessen":"erfasst"}</span></div><div style={$.prog}><div style={$.progF(tot>0?(msd/tot)*100:0)}/></div></div>
    {!isV&&isA("geometrie")&&f.geometrie&&(geoHasContent(f.geometrie)||geoCellCount(f.geometrie)>1)&&(()=>{const lf=geoLeaves(f.geometrie).find(l=>l.node.vg===v.id);  // Mini-Skizze: Feld dieser Verglasung hervorgehoben, Tippen springt zur anderen Verglasung
      return <div style={{...$.card,padding:10,display:"flex",gap:12,alignItems:"center"}}>
        <div style={{width:130,flexShrink:0}}><GeoSvg mini geo={f.geometrie} aspect={geoAspect(f.data?.fensterBreite,f.data?.fensterHoehe)} verglasungen={f.verglasungen} highlightVg={v.id} onSel={(pth,n)=>{if(n.vg&&n.vg!==v.id){const i=all.findIndex(x=>x.v.id===n.vg);if(i>=0)navTo(i);}}}/></div>
        <div style={{fontSize:11,color:C.tx2,lineHeight:1.5}}>{lf?<span>Feld: <b style={{color:C.tx}}>{lf.node.role||"Hauptfeld"}</b>{lf.node.art?` · ${lf.node.art}${lf.node.band?" ("+BAND_L[lf.node.band]+")":""}`:""}</span>:<span>Diese Verglasung ist keinem Feld zugeordnet (im Fenster „aus Geometrie übernehmen").</span>}<br/><span style={{color:C.tx3}}>Feld antippen = zu dieser Verglasung springen</span></div>
      </div>;})()}
    {mess&&msCard()}
    {isA("stempel")&&<div style={$.card}><div style={$.cardT}>Glasstempel</div><DInp style={{...$.inp,...$.inpS}} value={v.data?.stempel||""} onCommit={val=>setFV(rm.id,f.id,v.id,"stempel",val)} placeholder="Herstellerangaben"/><div style={{marginTop:6}}><Photos label="Stempel-Foto" photos={(v.photos||[]).filter(p=>p.isStempel)} onAdd={ph=>addPh(rm.id,f.id,v.id,{...ph,isStempel:true})} onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/></div></div>}
    {secFs("aufbau").length>0&&<div style={$.card}><Sec title="Aufbau">{secFs("aufbau").map(vfld)}</Sec></div>}
    <div style={$.card}><Photos label="Verglasung-Fotos" photos={(v.photos||[]).filter(p=>!p.isStempel&&!p.ms)} onAdd={ph=>addPh(rm.id,f.id,v.id,ph)} onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/></div>
    {!mess&&msCard()}
    {secFs("vkenn").length>0&&<div style={$.card}><Sec title="Kennwerte" collapsed summary={kennSum(secFs("vkenn"),v,f,v)}>{secFs("vkenn").map(vfld)}</Sec></div>}
    <div style={$.card}><div style={$.cardT}>Bemerkungen</div><DInp multiline style={{...$.inp,...$.inpS}} value={v.notizen||""} onCommit={t=>setNotiz(rm.id,f.id,v.id,t)} placeholder="Auffälligkeiten, Hinweise zur Verglasung…"/></div>
    {/* Navigation */}
    <div style={{display:"flex",gap:6,marginTop:8}}>
      {idx>0&&<button style={{...$.btn,...$.bO,flex:1}} onClick={()=>navTo(idx-1)}>← Vorherige</button>}
      {idx<tot-1?<button style={{...$.btn,...$.bP,flex:1}} onClick={()=>navTo(idx+1)}>Nächste →</button>
      :<button style={{...$.btn,...$.bOk,flex:1}} onClick={navRoom}>✓ Raum fertig</button>}
    </div>
    {/* Add extra verglasung */}
    {isV&&<button style={{...$.btn,...$.bO,...$.bBl,marginTop:8}} onClick={addAndGoExtra}>+ Weitere Verglasung</button>}
  </div>
  {/* Confirm dialog for unsaved data */}
  {confirmNav&&<ConfirmDialog message="Es gibt einen noch nicht gespeicherten Messwert im Ziffernblock. Ohne Speichern fortfahren?" onYes={()=>{setNumVal("");confirmNav.action();setConfirmNav(null);}} onNo={()=>setConfirmNav(null)}/>}
  {Toast}</div>;}

  return null;
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
