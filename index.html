window.addEventListener("error",function(e){if(!document.getElementById("boot"))return;var t=e.target;
  if(t&&t.tagName==="SCRIPT"&&t.src){show("⚠ Programmteil konnte nicht geladen werden:<br><small>"+t.src.split("/").pop()+"</small><br><br>Internetverbindung prüfen und neu laden.");return;}

// Editierbare thermische Standardwerte (global + Projekt-Override)
const UF_EPOCHS=["<1980","1980-1994","1995-2009",">=2010"];
const DEFAULT_TABLES={
  uf:{"Holz":{"<1980":2.0,"1980-1994":1.8,"1995-2009":1.6,">=2010":1.3},
      "Holz-Metall":{"<1980":2.2,"1980-1994":2.0,"1995-2009":1.7,">=2010":1.3},

      "Metall":{"<1980":5.0,"1980-1994":4.0,"1995-2009":2.6,">=2010":1.8},
      "Unbekannt":{"<1980":"","1980-1994":"","1995-2009":"",">=2010":""}},
  ug:{"2-fach IV":3.0,"2-fach WSV":1.3,"3-fach WSV":0.7,"Unbekannt":""},
  g:{"2-fach IV":0.76,"2-fach WSV":0.62,"3-fach WSV":0.50,"Unbekannt":""},
  psi:{"Aluminium":0.08,"Edelstahl (Warm Edge)":0.05,"Kunststoff (TGI/TPS)":0.04,"Unbekannt":""}
};
const TD_KEY="fc_thermalDefaults_v1";
let _gtd=null;
function loadGlobalTD(){if(_gtd)return _gtd;try{const s=localStorage.getItem(TD_KEY);_gtd=s?JSON.parse(s):JSON.parse(JSON.stringify(DEFAULT_TABLES));}catch(e){_gtd=JSON.parse(JSON.stringify(DEFAULT_TABLES));}return _gtd;}
function saveGlobalTD(t){_gtd=t;try{localStorage.setItem(TD_KEY,JSON.stringify(t));}catch(e){}}
function effTD(p){return (p&&p.thermalDefaults)||loadGlobalTD()||DEFAULT_TABLES;}
const ufEpoch=y=>{const n=parseInt(y,10);if(!n)return null;return n<1980?"<1980":n<1995?"1980-1994":n<2010?"1995-2009":">=2010";};
function resolveDef(k,fen,vg,p){
  const T=effTD(p),flat=(p&&p.defaults&&p.defaults[k])||"";
  const sel=(rec,key)=>(rec&&rec.data&&rec.data[key])||(p&&p.defaults&&p.defaults[key])||"";
  let cond="";
  if(k==="ufWert"){const m=sel(fen,"rahmenMaterial"),ep=ufEpoch(sel(fen,"baujahr"));if(m&&m!=="Unbekannt"&&ep&&T.uf[m])cond=T.uf[m][ep];}
  else if(k==="ugWert"||k==="gWert"){const gt=sel(vg,"verglasungsTyp");if(gt&&gt!=="Unbekannt")cond=(k==="ugWert"?T.ug:T.g)[gt];}
  else if(k==="psiWert"){const rv=sel(vg,"randverbundTyp");if(rv&&rv!=="Unbekannt")cond=T.psi[rv];}
  return (cond===0||cond)&&cond!==""?String(cond):flat;
}
// Geometrie-Helfer (Zeilen-Modell: rows[{h,cols}], cells{"r:c":{art,band}})
const BAND_L={"":"","L":"Links","R":"Rechts","O":"Oben","U":"Unten"};
const newGeo=()=>({rows:[{h:3,cols:1}],cells:{}});
function normalizeGeo(g){
  if(!g)return newGeo();
  if(Array.isArray(g.rows))return g;
  if("fluegel" in g){const rows=[];if(g.oberlicht)rows.push({h:1,cols:1});rows.push({h:3,cols:g.fluegel||1});if(g.bruestung)rows.push({h:1,cols:1});
    const cells={},mi=g.oberlicht?1:0;for(let c=0;c<(g.fluegel||1);c++){const t=g.oeff&&g.oeff["main:"+c+":0:0"];if(t)cells[mi+":"+c]={art:t,band:""};}
    return {rows,cells};}
  return newGeo();
}
function pruneCells(rows,cells){const out={};Object.keys(cells||{}).forEach(k=>{const[r,c]=k.split(":").map(Number);if(rows[r]&&c<(rows[r].cols||1))out[k]=cells[k];});return out;}
function shiftCells(cells,delta){const out={};Object.keys(cells||{}).forEach(k=>{const[r,c]=k.split(":").map(Number);out[(r+delta)+":"+c]=cells[k];});return out;}
function dropRowCells(ri,cells){const out={};Object.keys(cells||{}).forEach(k=>{const[r,c]=k.split(":").map(Number);if(r===ri)return;out[(r>ri?r-1:r)+":"+c]=cells[k];});return out;}
function geoCellCount(g){g=normalizeGeo(g);return (g.rows||[]).reduce((s,r)=>s+(r.cols||1),0);}
function geoSummary(g){g=normalizeGeo(g);const rows=g.rows||[];if(!rows.length)return "";
  const parts=[rows.map(r=>(r.role?r.role+":":"")+(r.cols||1)+"-flg").join("/")];
  const ops=[];Object.keys(g.cells||{}).sort().forEach(k=>{const c=g.cells[k];if(c&&c.art)ops.push(c.art+(c.band?"("+c.band+")":""));});
  if(ops.length)parts.push("Öffnung: "+ops.join(", "));
  return parts.join("; ");}
function masseSummary(m){if(!m)return "";const ab={oben:"O",unten:"U",links:"L",rechts:"R",mittelV:"MV",mittelH:"MH"};return RM_POS.map(([k])=>{const v=m[k]||{};const i=v.i||"",a=v.a||"";return (i||a)?ab[k]+" "+(i||"-")+"/"+(a||"-"):"";}).filter(Boolean).join(" · ");}

// Fields that support project-level defaults
const DEFAULTABLE_FIELDS = [

  "ufWert","psiWert","dichtungAnzahl","dichtungMaterial"
];

const FIELDS={

  fensterTyp:{label:"Fenstertyp",g:"f",t:"select",o:FEN_TYPEN},
  rahmenMaterial:{label:"Rahmenmaterial",g:"f",t:"select",o:FRAME_MAT},
  rahmenProfiltiefe:{label:"Rahmenprofiltiefe [mm]",g:"f",t:"number",src:true},
  baujahr:{label:"Baujahr",g:"f",t:"number",src:true},
  fensterBreite:{label:"Breite Fenster [mm]",g:"f",t:"number",src:true},
  fensterHoehe:{label:"Höhe Fenster [mm]",g:"f",t:"number",src:true},

  glasDichtung:{label:"Verglasungsdichtung innen",g:"v",t:"select",o:VG_DICHT},

  glasBreite:{label:"Glasbreite [mm]",g:"v",t:"number",src:true},

  glasBaujahr:{label:"Baujahr Verglasung",g:"v",t:"number",src:true},

};

const PRESETS={
  schnell:{name:"Schnell",desc:"Nur Verglasungstyp + Fotos",fields:["verglasungsTyp"]},
  standard:{name:"Standard",desc:"Rahmen, Beschläge, Dichtungen",fields:["fassade","fensterTyp","rahmenMaterial","baujahr","dichtungAnzahl","dichtungZustand","beschlagZustand","verglasungsTyp","lowE","randverbundTyp","randverbundZustand","scheibenaufbau","glasDichtung","glasDichtungAussen","psiWert"]},

// IndexedDB – eine gemeinsame Verbindung; Stores: projects (Projektdaten) + photos (Bild-Blobs).
// Fotos liegen bewusst NICHT im Projektobjekt: jede Änderung klont das ganze Projekt.
const PSTORE="photos";
let _dbP=null;
function openDB(){if(_dbP)return _dbP;_dbP=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,5);
  r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:"id"});if(!db.objectStoreNames.contains(PSTORE))db.createObjectStore(PSTORE,{keyPath:"id"});};
  r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();_dbP=null;};res(db);};
  r.onerror=()=>{_dbP=null;rej(r.error);};
  r.onblocked=()=>alert("FensterCheck ist noch in einem anderen Tab/Fenster geöffnet. Bitte dort schließen und hier neu laden.");});return _dbP;}
function idb(store,mode,fn){return openDB().then(db=>new Promise((res,rej)=>{const t=db.transaction(store,mode);const rq=fn(t.objectStore(store));let out;if(rq)rq.onsuccess=()=>{out=rq.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("Speichern abgebrochen (Speicher voll?)"));}));}
const dbAll=()=>idb(STORE,"readonly",s=>s.getAll());
const dbPut=d=>idb(STORE,"readwrite",s=>s.put(d));
const dbDel=k=>idb(STORE,"readwrite",s=>s.delete(k));
const phPut=rec=>idb(PSTORE,"readwrite",s=>s.put(rec));
const phGet=id=>idb(PSTORE,"readonly",s=>s.get(id));
const phDel=ids=>ids&&ids.length?idb(PSTORE,"readwrite",s=>{ids.forEach(id=>s.delete(id));}).catch(()=>{}):Promise.resolve();
const phKeys=()=>idb(PSTORE,"readonly",s=>s.getAllKeys());

// Fotos: Vollbild (max. PH_MAX px, JPEG) + Vorschaubild als Blobs im photos-Store.
// Im Projekt steht nur {id,zeit,w,h,kb,isStempel?}. Alte Fotos haben noch "data" (DataURL) und werden migriert.
const PH_MAX=1920,PH_Q=0.82,TH_MAX=320,TH_Q=0.7;
function loadImg(src){return new Promise((res,rej)=>{const img=new Image();const isB=src instanceof Blob;const u=isB?URL.createObjectURL(src):src;
  img.onload=()=>{if(isB)URL.revokeObjectURL(u);res(img);};img.onerror=()=>{if(isB)URL.revokeObjectURL(u);rej(new Error("Bild konnte nicht gelesen werden"));};img.src=u;});}
function scaledCanvas(img,max){const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;const s=Math.min(1,max/Math.max(W,H));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(W*s));c.height=Math.max(1,Math.round(H*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c;}
const toJpeg=(c,q)=>new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Bild konnte nicht umgewandelt werden")),"image/jpeg",q));
function dataURLtoBlob(d){const i=d.indexOf(",");const type=d.slice(5,i).split(";")[0]||"image/jpeg";const bin=atob(d.slice(i+1));const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type});}
// Neues Foto aus Kamera/Galerie verkleinern, speichern und Projekt-Metadaten liefern
async function storeNewPhoto(file){const img=await loadImg(file);const full=scaledCanvas(img,PH_MAX);const blob=await toJpeg(full,PH_Q);const tblob=await toJpeg(scaledCanvas(img,TH_MAX),TH_Q);const id=uid();
  await phPut({id,blob,tblob,w:full.width,h:full.height});return {id,zeit:new Date().toISOString(),w:full.width,h:full.height,kb:Math.round(blob.size/1024)};}
// Vorhandenes Bild (Blob oder DataURL) ohne Neukodierung übernehmen – immer mit neuer ID (Migration/Import)
async function storeExistingPhoto(meta,src){const blob=src instanceof Blob?src:dataURLtoBlob(src);let w=meta.w,h=meta.h,tblob=null;
  try{const img=await loadImg(blob);w=img.naturalWidth;h=img.naturalHeight;tblob=await toJpeg(scaledCanvas(img,TH_MAX),TH_Q);}catch(e){}
  const id=uid();await phPut({id,blob,tblob,w,h});const m={...meta,id,w,h,kb:Math.round(blob.size/1024)};delete m.data;delete m.file;return m;}
async function photoBlob(ph){if(ph.data)return dataURLtoBlob(ph.data);const r=await phGet(ph.id);return r&&r.blob||null;}
function photoLists(p){const out=[];(p.rooms||[]).forEach(r=>{out.push(r);(r.fenster||[]).forEach(f=>{out.push(f);(f.verglasungen||[]).forEach(v=>out.push(v));});});return out.filter(o=>Array.isArray(o.photos));}
// Foto-IDs in einem Projekt/Raum/Fenster/Verglasungs-Teilbaum (nur Store-Fotos)
function photoIdsIn(o){const s=[];const walk=x=>{if(!x)return;(x.photos||[]).forEach(ph=>{if(ph&&!ph.data)s.push(ph.id);});(x.rooms||[]).forEach(walk);(x.fenster||[]).forEach(walk);(x.verglasungen||[]).forEach(walk);};walk(o);return s;}
const legacyCount=p=>photoLists(p).reduce((s,o)=>s+o.photos.filter(ph=>ph&&ph.data).length,0);
async function migratePhotos(p,onStep){for(const o of photoLists(p)){const out=[];for(const ph of o.photos){if(ph&&ph.data){try{out.push(await storeExistingPhoto(ph,ph.data));}catch(e){out.push(ph);}onStep&&onStep();}else out.push(ph);}o.photos=out;}}
// Nicht mehr referenzierte Bild-Blobs entfernen (z.B. nach Löschen von Räumen/Fenstern)
async function gcPhotos(projects){try{const used=new Set();projects.forEach(p=>photoIdsIn(p).forEach(id=>used.add(id)));const keys=await phKeys();await phDel(keys.filter(k=>!used.has(k)));}catch(e){}}

// Gebäudeteile (Trakte): Reihenfolge aus p.trakte, ergänzt um Namen, die nur an Räumen stehen
function traktList(p){const t=[...((p&&p.trakte)||[])];((p&&p.rooms)||[]).forEach(r=>{if(r.trakt&&!t.includes(r.trakt))t.push(r.trakt);});return t;}
// Räume für Export sortiert: Gebäudeteil → Geschoss (Reihenfolge wie in der App) → Erfassungsreihenfolge
function sortedRooms(p){const tl=traktList(p);const ti=r=>{const i=tl.indexOf(r.trakt||"");return i<0?tl.length:i;};const fi=r=>{const i=FLOORS.indexOf(r.geschoss);return i<0?FLOORS.length:i;};
  return (p.rooms||[]).map((r,i)=>({r,i})).sort((a,b)=>ti(a.r)-ti(b.r)||fi(a.r)-fi(b.r)||a.i-b.i).map(x=>x.r);}
// Dateinamen der Fotos – gemeinsam für ZIP-Export und Excel-Fotoverzeichnis
const fnSafe=s=>String(s||"").trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\s+/g,"_");
function photoEntries(p){const out=[];let n=0;sortedRooms(p).forEach(room=>{const base=(room.trakt?fnSafe(room.trakt)+"_":"")+(fnSafe(room.geschoss)||"x")+"_"+(fnSafe(room.raumnummer||room.raumId)||"Raum");
  (room.photos||[]).forEach(ph=>{n++;out.push({ph,n,ebene:"Raum",room,fen:null,vg:null,typ:"Raum",name:`${base}_Raum_${n}.jpg`});});
  (room.fenster||[]).forEach(fen=>{(fen.photos||[]).forEach(ph=>{n++;out.push({ph,n,ebene:"Fenster",room,fen,vg:null,typ:"Fenster",name:`${base}_${fnSafe(fen.nr)}_${n}.jpg`});});
    (fen.verglasungen||[]).forEach(vg=>{(vg.photos||[]).forEach(ph=>{n++;const t=ph.isStempel?"Stempel":"Verglasung";out.push({ph,n,ebene:"Verglasung",room,fen,vg,typ:t,name:`${base}_${fnSafe(fen.nr)}_V${vg.nr}_${t}_${n}.jpg`});});});});});return out;}

// Minimaler ZIP-Writer (unkomprimiert): Fotos werden als Blob-Referenzen eingebunden statt in den Speicher kopiert
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function makeZip(entries,onStep){const enc=new TextEncoder(),parts=[],cd=[];let off=0,i=0;const d=new Date();
  const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const e of entries){const nm=enc.encode(e.name);const blob=typeof e.data==="string"?new Blob([enc.encode(e.data)]):e.data;const crc=crc32(new Uint8Array(await blob.arrayBuffer()));const sz=blob.size;
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,blob);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,nm);off+=30+nm.length+sz;i++;onStep&&onStep(i,entries.length);}
  const cdSize=cd.reduce((s,x)=>s+x.byteLength,0);const eo=new DataView(new ArrayBuffer(22));eo.setUint32(0,0x06054b50,true);eo.setUint16(8,entries.length,true);eo.setUint16(10,entries.length,true);eo.setUint32(12,cdSize,true);eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,eo.buffer],{type:"application/zip"});}
// ZIP lesen: unkomprimierte Einträge werden nur als Datei-Ausschnitt referenziert; komprimierte über SheetJS/CFB
async function readZip(file){const tl=Math.min(file.size,65557);const tail=new DataView(await file.slice(file.size-tl).arrayBuffer());let eo=-1;
  for(let i=tl-22;i>=0;i--){if(tail.getUint32(i,true)===0x06054b50){eo=i;break;}}if(eo<0)throw new Error("keine gültige ZIP-Datei");
  const n=tail.getUint16(eo+10,true),cdSize=tail.getUint32(eo+12,true),cdOff=tail.getUint32(eo+16,true);const cdv=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());const dec=new TextDecoder();const out=new Map();let p=0,packed=false;
  for(let k=0;k<n&&p+46<=cdv.byteLength;k++){if(cdv.getUint32(p,true)!==0x02014b50)break;const method=cdv.getUint16(p+10,true),csz=cdv.getUint32(p+20,true),nl=cdv.getUint16(p+28,true),el=cdv.getUint16(p+30,true),cl=cdv.getUint16(p+32,true),lo=cdv.getUint32(p+42,true);
    const name=dec.decode(new Uint8Array(cdv.buffer,p+46,nl));p+=46+nl+el+cl;if(name.endsWith("/"))continue;if(method!==0){packed=true;break;}
    const lh=new DataView(await file.slice(lo,lo+30).arrayBuffer());const st=lo+30+lh.getUint16(26,true)+lh.getUint16(28,true);out.set(name,file.slice(st,st+csz));}
  if(packed){const cfb=XLSX.CFB.read(new Uint8Array(await file.arrayBuffer()),{type:"array"});out.clear();cfb.FullPaths.forEach((fp,i)=>{const e=cfb.FileIndex[i];if(e.type===2&&e.content&&!/Sh33tJ5/.test(fp))out.set(fp.replace(/^Root Entry\//,""),new Blob([e.content]));});}
  return out;}
// Projektdatei (ZIP oder JSON, auch alte JSON-Backups mit eingebetteten Fotos) lesen; Fotos landen mit neuen IDs im Store
async function readProjectFile(file){const head=await file.slice(0,2).text();let d,files=null;
  if(head==="PK"){files=await readZip(file);const jf=[...files.keys()].find(k=>/\.json$/i.test(k));if(!jf)throw new Error("ZIP enthält keine Projektdaten");d=JSON.parse(await files.get(jf).text());}
  else d=JSON.parse(await file.text());
  if(!d||!d.id||!Array.isArray(d.rooms))throw new Error("keine FensterCheck-Projektdatei");
  for(const o of photoLists(d)){const out=[];for(const ph of o.photos){try{if(ph.data)out.push(await storeExistingPhoto(ph,ph.data));else if(ph.file&&files&&files.get(ph.file))out.push(await storeExistingPhoto(ph,files.get(ph.file)));}catch(e){}}o.photos=out;}
  delete d._format;return d;}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);}

// Messungen je Verglasung: mehrere Werte je Messart. Alte Einträge ohne "typ" sind Gasfüllgrad.
const MS_TYPES={
  gas:{label:"Gasfüllgrad",short:"Gas",unit:"%",min:0,max:100},
  ug:{label:"Ug gemessen",short:"Ug",unit:"W/m²K",min:0.2,max:6.5},
  tp:{label:"Taupunkt",short:"TP",unit:"°C",min:-80,max:30,neg:true},
};
const MS_KEYS=Object.keys(MS_TYPES);
const msTyp=m=>(m&&m.typ&&MS_TYPES[m.typ])?m.typ:"gas";
const msOf=(v,t)=>((v&&v.messungen)||[]).filter(m=>msTyp(m)===t);
const fmtMs=m=>m?`${m.wert} ${MS_TYPES[msTyp(m)].unit}`:"";
function msStats(list){const w=list.map(m=>m.wert).filter(x=>typeof x==="number"&&!isNaN(x));if(!w.length)return null;const s=[...w].sort((a,b)=>a-b);const r=x=>Math.round(x*100)/100;
  return {n:w.length,avg:r(w.reduce((a,b)=>a+b,0)/w.length),min:s[0],max:s[s.length-1],med:r(s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2)};}
// Eine Verglasung gilt als "erfasst", wenn sie (oder ihr Fenster) dokumentiert ist – Messung, Foto, Daten oder Zustand.
const vgErf=(f,v)=>(v?.messungen?.length>0)||((v?.photos||[]).length>0)||Object.values(v?.data||{}).some(x=>x&&(""+x).trim())||((f?.photos||[]).length>0)||Object.values(f?.data||{}).some(x=>x&&(""+x).trim())||!!f?.zustandRahmen;
function parseCSV(text){const ls=text.trim().split(/\r?\n/);if(ls.length<2)return[];const h=ls[0].split(/[;,\t]/).map(x=>x.trim().toLowerCase());return ls.slice(1).map(l=>{const v=l.split(/[;,\t]/).map(x=>x.trim());const o={};h.forEach((x,i)=>{o[x]=v[i]||"";});return o;}).filter(r=>Object.values(r).some(v=>v));}

// Export
function buildExport(p){
  const af=new Set(p.activeFields||[]);
  const ff=Object.entries(FIELDS).filter(([k,d])=>d.g==="f"&&d.t!=="zustand"&&d.t!=="geo"&&d.t!=="masse"&&af.has(k));
  const vf=Object.entries(FIELDS).filter(([k,d])=>d.g==="v"&&af.has(k));
  const geoOn=af.has("geometrie"),masseOn=af.has("rahmenmasse");
  const ov=[];
  ov.push(["FensterCheck – Projektexport"],[],["Projektname",p.name||""],["Gebäude",p.gebaeude||""],["Adresse",p.adresse||""],
    ["Begeher/in",p.begeher||""],["Begehungsdatum",p.begehungsdatum||""],["Witterung",p.witterung||""],
    ["Temp. aussen [°C]",p.tempAussen||""],["Temp. innen [°C]",p.tempInnen||""],
    ["Feuchte aussen [%rF]",p.feuchteAussen||""],["Feuchte innen [%rF]",p.feuchteInnen||""],
    ["Erstellt",p.erstellt?new Date(p.erstellt).toLocaleDateString("de-CH"):""],
    ["Geändert",p.geaendert?new Date(p.geaendert).toLocaleString("de-CH"):""],
    ["Modus",p.modus==="fenster"?"Fenster+Verglasungen":"Nur Verglasungen"],...(traktList(p).length?[["Gebäudeteile",traktList(p).join(", ")]]:[]),[]);
  const rooms=sortedRooms(p);
  let tR=0,tF=0,tV=0,tP=0;const tM={};MS_KEYS.forEach(t=>tM[t]=0);
  (p.rooms||[]).forEach(r=>{tR++;tP+=(r.photos||[]).length;(r.fenster||[]).forEach(f=>{tF++;tP+=(f.photos||[]).length;(f.verglasungen||[]).forEach(v=>{tV++;(v.messungen||[]).forEach(m=>{tM[msTyp(m)]++;});tP+=(v.photos||[]).length;});});});
  ov.push(["Statistik"],["Räume",tR],["Fenster",tF],["Verglasungen",tV],...MS_KEYS.map(t=>["Messungen "+MS_TYPES[t].label,tM[t]]),["Fotos",tP],[],
    ["Datenquellen"],["M","Messwert"],["H","Herstellerangabe"],["P","Planungsdaten"]);
  // Defaults
  if(p.defaults&&Object.keys(p.defaults).length>0){ov.push([],["Standardwerte"]);Object.entries(p.defaults).forEach(([k,v])=>{if(v&&FIELDS[k])ov.push([FIELDS[k].label,v]);});}

  // Gemeinsame Daten-Spalten (Verglasung, Fenster, Zustand, Geometrie, Maße, Notizen)
  const zOn=p.zustandModus&&p.zustandModus!=="Keine";
  const fHead=[];
  vf.forEach(([k,d])=>{fHead.push(d.label);if(d.src&&p.showSrc)fHead.push(d.label+" [Quelle]");});
  ff.forEach(([k,d])=>{fHead.push(d.label);if(d.src&&p.showSrc)fHead.push(d.label+" [Quelle]");});
  if(zOn)fHead.push("Zustand Rahmen");
  if(geoOn)fHead.push("Geometrie","Zeilen","Felder");
  if(masseOn)fHead.push("Rahmenmaße i/a [mm]");
  fHead.push("Notizen");
  const fCells=(fen,vg)=>{const row=[];
    vf.forEach(([k,d])=>{row.push(vg.data?.[k]||resolveDef(k,fen,vg,p));if(d.src&&p.showSrc)row.push(vg.sources?.[k]||"");});
    ff.forEach(([k,d])=>{row.push(fen.data?.[k]||resolveDef(k,fen,null,p));if(d.src&&p.showSrc)row.push(fen.sources?.[k]||"");});
    if(zOn)row.push(fen.zustandRahmen||"");
    if(geoOn){const g=fen.geometrie;row.push(geoSummary(g),g?normalizeGeo(g).rows.length:"",g?geoCellCount(g):"");}
    if(masseOn)row.push(masseSummary(fen.rahmenmasse));
    row.push(vg.notizen||"");return row;};
  const loc=(room,fen,vg)=>[room.trakt||"",room.geschoss||"",room.raumId||"",room.raumnummer||"",fen.nr||"",vg.nr||""];

  // Blatt "Verglasungen": eine Zeile je Verglasung, Kennzahlen je Messart
  const vHead=["Gebäudeteil","Geschoss","Raum-ID","Raumnummer","Fenster-Nr","Verglasung-Nr","Erfasst"];
  MS_KEYS.forEach(t=>{const T=MS_TYPES[t];vHead.push(`${T.label} Anzahl`,`${T.label} Ø [${T.unit}]`,`${T.label} min [${T.unit}]`,`${T.label} max [${T.unit}]`);});
  const vr=[[...vHead,...fHead]];
  // Blatt "Messungen": eine Zeile je Messwert (Verglasungen ohne Messung: eine Zeile ohne Wert)
  const mr=[["Gebäudeteil","Geschoss","Raum-ID","Raumnummer","Fenster-Nr","Verglasung-Nr","Messart","Messwert","Einheit","Messung-Nr","Zeitstempel","Datum","Uhrzeit",...fHead]];
  rooms.forEach(room=>{(room.fenster||[]).forEach(fen=>{(fen.verglasungen||[]).forEach(vg=>{
    const L=loc(room,fen,vg),fc=fCells(fen,vg),ms=vg.messungen||[];
    const vrow=[...L,vgErf(fen,vg)?"ja":"nein"];MS_KEYS.forEach(t=>{const st=msStats(msOf(vg,t));vrow.push(st?st.n:"",st?st.avg:"",st?st.min:"",st?st.max:"");});vr.push([...vrow,...fc]);
    if(!ms.length){mr.push([...L,"","","","","","","",...fc]);return;}
    const cnt={};ms.forEach(m=>{const t=msTyp(m),T=MS_TYPES[t];cnt[t]=(cnt[t]||0)+1;const z=new Date(m.zeit),ok=!isNaN(z);
      mr.push([...L,T.label,m.wert,T.unit,cnt[t],m.zeit||"",ok?z.toLocaleDateString("de-CH"):"",ok?z.toLocaleTimeString("de-CH"):"",...fc]);});
  });});});

  // Blatt "Zusammenfassung" je Raum
  const zr=[["Gebäudeteil","Geschoss","Raum-ID","Raumnummer","Fenster","Verglasungen","Erfasst [%]","Messwerte","Gasfüllgrad Ø [%]","Gasfüllgrad min [%]","Gasfüllgrad max [%]","Gasfüllgrad Median [%]","Ug gemessen Ø [W/m²K]","Taupunkt Ø [°C]","Taupunkt max [°C]","Fotos"]];
  rooms.forEach(room=>{let fc=0,vc=0,ec=0,mc=0,pc=(room.photos||[]).length;const all={};MS_KEYS.forEach(t=>all[t]=[]);
    (room.fenster||[]).forEach(f=>{fc++;pc+=(f.photos||[]).length;(f.verglasungen||[]).forEach(v=>{vc++;if(vgErf(f,v))ec++;pc+=(v.photos||[]).length;(v.messungen||[]).forEach(m=>{mc++;all[msTyp(m)].push(m);});});});
    const g=msStats(all.gas),u=msStats(all.ug),tp=msStats(all.tp);
    zr.push([room.trakt||"",room.geschoss||"",room.raumId||"",room.raumnummer||"",fc,vc,vc>0?Math.round(ec/vc*100):0,mc,g?g.avg:"",g?g.min:"",g?g.max:"",g?g.med:"",u?u.avg:"",tp?tp.avg:"",tp?tp.max:"",pc]);
  });

  // Blatt "Fotoverzeichnis" – Dateinamen entsprechen dem ZIP-Export (Ordner "fotos")
  const fr=[["Nr","Ebene","Gebäudeteil","Geschoss","Raumnummer","Fenster","Verglasung","Typ","Zeitstempel","Datei im ZIP"]];
  photoEntries(p).forEach(e=>fr.push([e.n,e.ebene,e.room.trakt||"",e.room.geschoss||"",e.room.raumnummer||"",e.fen?e.fen.nr:"",e.vg?e.vg.nr:"",e.typ,e.ph.zeit||"","fotos/"+e.name]));
  return{ov,mr,vr,zr,fr};
}

function doExcelExport(p){const d=buildExport(p);const wb=XLSX.utils.book_new();
  const w1=XLSX.utils.aoa_to_sheet(d.ov);w1["!cols"]=[{wch:28},{wch:50}];XLSX.utils.book_append_sheet(wb,w1,"Übersicht");
  const wv=XLSX.utils.aoa_to_sheet(d.vr);wv["!cols"]=d.vr[0].map(h=>({wch:Math.max(10,Math.min(String(h).length+2,22))}));wv["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:d.vr[0].length-1}})};XLSX.utils.book_append_sheet(wb,wv,"Verglasungen");
  const w2=XLSX.utils.aoa_to_sheet(d.mr);w2["!cols"]=d.mr[0].map(h=>({wch:Math.max(10,Math.min(String(h).length+2,22))}));w2["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:d.mr[0].length-1}})};XLSX.utils.book_append_sheet(wb,w2,"Messungen");
  const w3=XLSX.utils.aoa_to_sheet(d.zr);w3["!cols"]=d.zr[0].map(h=>({wch:Math.max(10,Math.min(String(h).length+2,20))}));w3["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:d.zr[0].length-1}})};XLSX.utils.book_append_sheet(wb,w3,"Zusammenfassung");
  if(d.fr.length>1){const w4=XLSX.utils.aoa_to_sheet(d.fr);XLSX.utils.book_append_sheet(wb,w4,"Fotoverzeichnis");}
  XLSX.writeFile(wb,expName(p,"xlsx"));}
const expName=(p,ext)=>`FensterCheck_${fnSafe(p.name)||"Projekt"}_${new Date().toISOString().slice(0,10)}.${ext}`;
function doCSVExport(p){const d=buildExport(p);const csv=d.mr.map(r=>r.map(c=>{const s=String(c??"");return s.includes(";")||s.includes('"')||s.includes("\n")?'"'+s.replace(/"/g,'""')+'"':s;}).join(";")).join("\n");download(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}),expName(p,"csv"));}
function stripPhotos(p){const c=JSON.parse(JSON.stringify(p));photoLists(c).forEach(o=>{o.photos=[];});return c;}
// Nur Daten (ohne Fotos) \u2013 klein, z.B. zum Zusammenf\u00FChren zwischen Ger\u00E4ten

// ZIP mit Projektdaten (fenstercheck.json) + allen Fotos als lesbar benannte Dateien \u2013 wieder importierbar
async function doZipExport(p,onStep){const ents=photoEntries(p);const fileOf={};ents.forEach(e=>{fileOf[e.ph.id]="fotos/"+e.name;});
  const data=JSON.parse(JSON.stringify(p));photoLists(data).forEach(o=>o.photos.forEach(ph=>{if(fileOf[ph.id])ph.file=fileOf[ph.id];delete ph.data;}));data._format="fenstercheck-zip-1";
  const entries=[{name:"fenstercheck.json",data:JSON.stringify(data,null,1)}];let miss=0;
  for(const e of ents){const b=await photoBlob(e.ph);if(b)entries.push({name:"fotos/"+e.name,data:b});else miss++;}

      {!zoom&&n>1&&<button style={{...vb,position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",fontSize:22,padding:"10px 14px"}} onClick={()=>go(-1)}>‹</button>}

// DIN-Öffnungssymbol je Feld (Dreieck-Spitze zur Bandseite)
function openingSymbol(cell,x,y,w,h,key){
  const a=cell.art||"",band=cell.band||"",col=C.ac,sw=1.2,m=4,els=[];const cx=x+w/2,cy=y+h/2;
  const L=(x1,y1,x2,y2,i)=><line key={key+"_"+i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={col} strokeWidth={sw} style={{pointerEvents:"none"}}/>;
  const drehL=()=>[L(x+w-m,y+m,x+m,cy,1),L(x+w-m,y+h-m,x+m,cy,2)];
  const drehR=()=>[L(x+m,y+m,x+w-m,cy,1),L(x+m,y+h-m,x+w-m,cy,2)];
  const apexTop=()=>[L(x+m,y+h-m,cx,y+m,3),L(x+w-m,y+h-m,cx,y+m,4)];   // Spitze oben → Kipp
  const apexBottom=()=>[L(x+m,y+m,cx,y+h-m,5),L(x+w-m,y+m,cx,y+h-m,6)]; // Spitze unten → Klapp
  if(a==="Dreh"||a==="Dreh-Kipp")els.push(...(band==="R"?drehR():drehL()));
  if(a==="Kipp"||a==="Dreh-Kipp")els.push(...apexTop());

  return els;
}

// Detaillierte Rahmen-Abmessungen (je Seite + Mittelstege, innen/aussen)
function RahmenMasse({val,onChange}){

// Editor für thermische Standardwerte (global + Projekt-Override)
function ThermalEditor({tables,onChange}){
  const T=tables;
  const setCell=(cat,row,col,v)=>{const t=JSON.parse(JSON.stringify(T));if(col===null)t[cat][row]=v;else{if(!t[cat][row])t[cat][row]={};t[cat][row][col]=v;}onChange(t);};
  const numIn=(v,onCh,step)=><input style={{...$.inp,...$.inpS,textAlign:"center",padding:"6px 4px"}} type="number" step={step} value={(v===0||v)?v:""} onChange={e=>onCh(e.target.value)}/>;
  const list=(cat,types,step)=>types.map(t=><div key={t} style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><span style={{flex:1,fontSize:12,color:C.tx2}}>{t}</span><div style={{width:90}}>{numIn(T[cat]?.[t],v=>setCell(cat,t,null,v),step)}</div></div>);

    <div style={{fontSize:11,fontWeight:700,color:C.ac,marginBottom:4}}>Uf – Rahmen [W/m²K]</div>
    <div style={{overflowX:"auto"}}><div style={{minWidth:340}}>
      <div style={{display:"grid",gridTemplateColumns:"96px repeat(4,1fr)",gap:4,marginBottom:3}}><span></span>{UF_EPOCHS.map(e=><span key={e} style={{fontSize:10,color:C.tx2,textAlign:"center"}}>{e}</span>)}</div>
      {FRAME_MAT.filter(mm=>mm!=="Unbekannt").map(mm=><div key={mm} style={{display:"grid",gridTemplateColumns:"96px repeat(4,1fr)",gap:4,alignItems:"center",marginBottom:3}}>
        <span style={{fontSize:11,color:C.tx2}}>{mm}</span>
        {UF_EPOCHS.map(e=><div key={e}>{numIn(T.uf?.[mm]?.[e],v=>setCell("uf",mm,e,v),"0.01")}</div>)}
      </div>)}
    </div></div>
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>Ug – Glas [W/m²K]</div>{list("ug",GLAZ_TYPES.filter(t=>t!=="Unbekannt"),"0.01")}
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>g-Wert</div>{list("g",GLAZ_TYPES.filter(t=>t!=="Unbekannt"),"0.01")}
    <div style={{fontSize:11,fontWeight:700,color:C.ac,margin:"10px 0 4px"}}>ψ – Randverbund [W/mK]</div>{list("psi",RV_TYPES.filter(t=>t!=="Unbekannt"),"0.001")}
  </div>;
}

// Main App
function App(){

  const[bootMsg,setBootMsg]=useState(""); // Fortschritt beim Start (Foto-Migration)
  const[bootErr,setBootErr]=useState(null);
  const[busyMsg,setBusyMsg]=useState(""); // länger laufende Aktionen (ZIP, Import)
  const[storInfo,setStorInfo]=useState(null);
  const[edR,setEdR]=useState(null); // Raum bearbeiten {geschoss,raumnummer,raumId,trakt}
  const[newTrakt,setNewTrakt]=useState("");

  // Start: Projekte laden, alte eingebettete Fotos in den Foto-Store verschieben, verwaiste Bilder entfernen.
  // Die Oberfläche bleibt bis dahin gesperrt, damit keine Bearbeitung mit der Migration kollidiert.
  useEffect(()=>{(async()=>{try{
    const d=(await dbAll())||[];const todo=d.filter(p=>legacyCount(p)>0);const total=todo.reduce((s,p)=>s+legacyCount(p),0);let done=0;
    for(const p of todo){await migratePhotos(p,()=>{done++;setBootMsg(`Fotos werden umgestellt… ${done}/${total}`);});await dbPut(p);}
    await gcPhotos(d);setProjects(d);setLoading(false);
  }catch(e){console.error(e);setBootErr(e&&e.message||String(e));}
    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}})();},[]);
  useEffect(()=>{if(view!=="settings"||!navigator.storage||!navigator.storage.estimate)return;
    Promise.all([navigator.storage.estimate(),navigator.storage.persisted?navigator.storage.persisted():Promise.resolve(null)]).then(([e,per])=>setStorInfo({used:e.usage||0,quota:e.quota||0,per})).catch(()=>{});},[view]);
  const flash=m=>{setToast(m);setTimeout(()=>setToast(t=>t===m?null:t),2500);};

  // Track unsaved state
  useEffect(()=>{setHasUnsaved(numVal.length>0);},[numVal]);

  const guardNav=(action)=>{
    if(hasUnsaved){setConfirmNav({action});}
    else action();
  };

  // projRef = aktuellster Projektstand. Wird in save() sofort gesetzt, damit mehrere Änderungen
  // hintereinander (z.B. mehrere Fotos, Eingabe beim Verlassen einer Ansicht) nicht auf einem alten Stand aufbauen.
  const projRef=useRef(null);projRef.current=proj;
  const save=p=>{const np={...p,geaendert:new Date().toISOString()};projRef.current=np;setProj(np);
    setProjects(pv=>{const i=pv.findIndex(x=>x.id===np.id);if(i>=0){const n=[...pv];n[i]=np;return n;}return[...pv,np];});
    return dbPut(np).catch(e=>{console.error(e);flash("⚠ Speichern fehlgeschlagen: "+(e&&e.message||e));});};
  const gR=(p,id)=>p.rooms.find(r=>r.id===id);
  const gF=(r,id)=>r?.fenster?.find(f=>f.id===id);
  const gV=(f,id)=>f?.verglasungen?.find(v=>v.id===id);
  // Nächste freie Nummer mit Präfix (z.B. "V" oder "F") – Array-Länge kollidiert nach Löschungen
  const nextNr=(r,pre)=>{let mx=0;(r.fenster||[]).forEach(f=>{const m=String(f.nr||"").match(new RegExp("^"+pre+"(\\d+)$"));if(m)mx=Math.max(mx,+m[1]);});return mx+1;};
  const mut=fn=>{const base=projRef.current;if(!base)return;const p=typeof structuredClone==="function"?structuredClone(base):JSON.parse(JSON.stringify(base));fn(p);return save(p);};

  const hasData=p=>{let n=0;(p?.rooms||[]).forEach(r=>(r.fenster||[]).forEach(f=>(f.verglasungen||[]).forEach(v=>{n+=(v.messungen||[]).length;})));return n>0;};

  const createProj=()=>{const p={id:uid(),name:"",gebaeude:"",adresse:"",erstellt:new Date().toISOString(),geaendert:new Date().toISOString(),modus:"fenster",zustandModus:"Keine",activeFields:[...PRESETS.standard.fields],defaults:{},trakte:[],rooms:[]};setProj(p);setView("setup");};
  const delProj=async id=>{const old=projects.find(x=>x.id===id);await dbDel(id);if(old)phDel(photoIdsIn(old));setProjects(p=>p.filter(x=>x.id!==id));if(proj?.id===id){setProj(null);setView("home");}};

  // Gebäudeteile (Trakte): Ebene über Geschoss/Raum. Räume tragen den Namen in room.trakt, die Reihenfolge steht in p.trakte.
  // Verwaltung in der Einrichtung: wie die übrigen Einrichtungsfelder lokal, gespeichert mit "Fertig" (bzw. der nächsten Änderung)
  const trUpd=fn=>{const np=JSON.parse(JSON.stringify(projRef.current));fn(np);projRef.current=np;setProj(np);};
  const addTrakt=name=>{const n=(name||"").trim();if(!n)return;if(traktList(projRef.current).includes(n)){flash("Gebäudeteil existiert bereits");return;}trUpd(p=>{p.trakte=[...traktList(p),n];});};
  const renTrakt=(old,name)=>{const n=(name||"").trim();if(!n||n===old)return;if(traktList(projRef.current).includes(n)){flash("Name bereits vergeben");return;}trUpd(p=>{p.trakte=traktList(p).map(t=>t===old?n:t);(p.rooms||[]).forEach(r=>{if(r.trakt===old)r.trakt=n;});});};
  const delTrakt=t=>{const cnt=(projRef.current.rooms||[]).filter(r=>r.trakt===t).length;if(!confirm(cnt?`Gebäudeteil «${t}» entfernen? ${cnt} Raum/Räume werden «ohne Gebäudeteil» geführt (nicht gelöscht).`:`Gebäudeteil «${t}» entfernen?`))return;trUpd(p=>{(p.rooms||[]).forEach(r=>{if(r.trakt===t)r.trakt="";});p.trakte=traktList(p).filter(x=>x!==t);});};
  const moveTrakt=(t,d)=>trUpd(p=>{const l=traktList(p);const i=l.indexOf(t),j=i+d;if(i<0||j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];p.trakte=l;});
  const setRoomProps=(rId,vals)=>mut(p=>{const r=gR(p,rId);if(!r)return;Object.assign(r,vals);p.trakte=traktList(p);});
  const renFen=(rId,fId,nr)=>{const n=(nr||"").trim();if(!n)return;mut(p=>{const f=gF(gR(p,rId),fId);if(f)f.nr=n;});};

  // Import von ZIP (Daten + Fotos) oder JSON (auch alte Backups mit eingebetteten Fotos)
  const impFile=async(file,merge)=>{if(!file)return;setBusyMsg("Import läuft…");try{const d=await readProjectFile(file);
      if(merge&&projRef.current){const cur=projRef.current;const ids=new Set(cur.rooms.map(r=>r.id));const added=d.rooms.filter(r=>!ids.has(r.id)),skipped=d.rooms.filter(r=>ids.has(r.id));
        phDel(skipped.flatMap(r=>photoIdsIn(r)));mut(p=>{p.rooms=[...p.rooms,...added];p.trakte=traktList(p);});
        flash(`Zusammengeführt: ${added.length} Räume neu`+(skipped.length?`, ${skipped.length} bereits vorhanden`:""));}
      else{d.id=uid();save(d);setView("survey");flash(`Projekt «${d.name||"Import"}» importiert`);}
    }catch(e){console.error(e);flash("Import fehlgeschlagen: "+(e&&e.message||e));}setBusyMsg("");};
  const csvTrakt=r=>r.trakt||r.gebaeudeteil||r["gebäudeteil"]||r.bauteil||r.gebaeude||r["gebäude"]||"";
  const impRooms=()=>{if(!impTxt.trim())return;const d=parseCSV(impTxt);if(!d.length){flash("Keine Daten");return;}
    const hasPerWindow=d.some(r=>r.fenster_nr||r.fensternr||r.window_nr);
    mut(p=>{
      if(hasPerWindow){
        const groups=new Map();
        d.forEach(r=>{
          const geschoss=r.geschoss||r.floor||"";
          const raumnummer=r.raumnummer||r.room||"";
          const raumId=r.raumid||r.raum_id||r.id||"";
          const trakt=csvTrakt(r);
          if(!raumnummer&&!raumId)return;
          const key=`${trakt}||${geschoss}||${raumnummer}||${raumId}`;
          if(!groups.has(key))groups.set(key,{trakt,geschoss,raumnummer,raumId,windows:[]});

          const nVg=parseInt(r.verglasungen||r.anzahl_verglasungen||r.glazings||"1")||1;
          groups.get(key).windows.push({nr:fnr,nVg});
        });
        groups.forEach(g=>{
          const rm={id:uid(),trakt:g.trakt,geschoss:g.geschoss,raumnummer:g.raumnummer,raumId:g.raumId,fenster:[],photos:[]};
          g.windows.forEach((w,wi)=>{
            const nr=w.nr||`F${wi+1}`;
            if(p.modus==="fenster"){
              rm.fenster.push({id:uid(),nr,
                verglasungen:Array.from({length:w.nVg},(_,vi)=>({id:uid(),nr:vi+1,messungen:[],data:{},sources:{},photos:[],notizen:""})),
                data:{},sources:{},photos:[],notizen:""});
            } else {
              for(let vi=0;vi<w.nVg;vi++){
                rm.fenster.push({id:uid(),nr:`V${rm.fenster.length+1}`,isVg:1,
                  verglasungen:[{id:uid(),nr:1,messungen:[],data:{},sources:{},photos:[],notizen:""}],
                  data:{},sources:{},photos:[],notizen:""});
              }
            }
          });
          p.rooms.push(rm);
        });
      } else {
        const newRooms=d.map(r=>{
          const geschoss=r.geschoss||r.floor||"";
          const raumnummer=r.raumnummer||r.room||"";
          const raumId=r.raumid||r.raum_id||r.id||"";
          if(!raumnummer&&!raumId)return null;
          const rm={id:uid(),trakt:csvTrakt(r),geschoss,raumnummer,raumId,fenster:[],photos:[]};
          const nFen=parseInt(r.fenster||r.anzahl_fenster||r.windows||"0")||0;
          const nVgJeFen=parseInt(r.verglasungen_je_fenster||r.vg_je_fenster||r.glazings_per_window||"0")||0;
          const nVgTotal=parseInt(r.verglasungen||r.anzahl_verglasungen||r.glazings||"0")||0;
          if(p.modus==="fenster"&&nFen>0){
            const vgPer=nVgJeFen||1;
            for(let fi=0;fi<nFen;fi++){
              rm.fenster.push({id:uid(),nr:`F${fi+1}`,
                verglasungen:Array.from({length:vgPer},(_,vi)=>({id:uid(),nr:vi+1,messungen:[],data:{},sources:{},photos:[],notizen:""})),
                data:{},sources:{},photos:[],notizen:""});

          } else if(nVgTotal>0){
            for(let vi=0;vi<nVgTotal;vi++){
              rm.fenster.push({id:uid(),nr:`V${vi+1}`,isVg:1,

                data:{},sources:{},photos:[],notizen:""});

          } else if(nFen>0&&p.modus==="verglasung"){

            for(let vi=0;vi<total;vi++){
              rm.fenster.push({id:uid(),nr:`V${vi+1}`,isVg:1,
                verglasungen:[{id:uid(),nr:1,messungen:[],data:{},sources:{},photos:[],notizen:""}],
                data:{},sources:{},photos:[],notizen:""});
            }
          }
          return rm;
        }).filter(Boolean);
        p.rooms=[...p.rooms,...newRooms];
      }
      p.trakte=traktList(p);
    });
    const parsed=parseCSV(impTxt);
    const hasWin=parsed.some(r=>r.fenster_nr||r.fensternr||r.window_nr);
    const nR=hasWin?new Set(parsed.map(r=>`${r.geschoss||""}|${r.raumnummer||r.room||""}`)).size:parsed.filter(r=>r.raumnummer||r.raumid||r.raum_id||r.id||r.room).length;
    setImpTxt("");flash(`${nR} Räume importiert`);};

  const addRoom=()=>{if(!fmR.raumnummer&&!fmR.raumId)return;const t=(fmR.trakt||"").trim();mut(p=>{p.rooms.push({id:uid(),trakt:t,geschoss:fmR.geschoss,raumnummer:fmR.raumnummer,raumId:fmR.raumId,fenster:[],photos:[]});p.trakte=traktList(p);});setFmR({...fmR,raumnummer:"",raumId:""});setModal(null);flash("Raum +");};

        {vf.length>0&&<div style={{marginTop:6,display:"flex",gap:4,flexWrap:"wrap"}}>{vf.slice(0,3).map(([k,d])=><div key={k} style={{flex:1,minWidth:80}}>{d.t==="select"?<select style={{...$.sel,...$.selS,fontSize:11}} value={v?.data?.[k]||""} onChange={e=>setFV(rm.id,f.id,v.id,k,e.target.value)}><option value="">{getDef(k,f,v)?`Std: ${getDef(k,f,v)}`:d.label.split(" ")[0]+"..."}</option>{d.o.map(o=><option key={o}>{o}</option>)}</select>:<DInp style={{...$.inp,...$.inpS,fontSize:11}} placeholder={getDef(k,f,v)||d.label.split("[")[0]} value={v?.data?.[k]||""} onCommit={val=>setFV(rm.id,f.id,v.id,k,val)}/>}</div>)}</div>}
      </div>;}
      else return <div key={f.id} style={$.card}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{fontWeight:800,fontSize:16,cursor:"pointer"}} title="Fenster umbenennen" onClick={()=>{const n=prompt("Fenster-Nr. / Bezeichnung",f.nr);if(n!=null)renFen(rm.id,f.id,n);}}>🪟 {f.nr} <span style={{fontSize:12,color:C.tx3,fontWeight:400}}>✎</span></span><div style={{display:"flex",alignItems:"center",gap:6}}>{f.verglasungen?.every(v=>vgErf(f,v))&&<span style={{...$.badge,background:C.okBg,color:C.ok}}>✓</span>}<button style={{...$.btn,...$.bO,...$.bS,padding:"4px 9px"}} onClick={()=>{setDupFenId(f.id);setDupQty(1);setModal("dupF");}} title="Fenster duplizieren">⧉ Duplizieren</button></div></div>
        {ff.length>0&&<div style={{marginBottom:8}}>{ff.map(([k,d])=><FldInp key={k} k={k} def={d} value={f.data?.[k]||""} source={f.sources?.[k]||""} onVal={v=>setFV(rm.id,f.id,null,k,v)} onSrc={s=>setFS(rm.id,f.id,null,k,s)} defaultVal={getDef(k,f,null)} showSrc={proj?.showSrc}/>)}</div>}
        {hasZ()&&<ZustInp modus={p.zustandModus} value={f.zustandRahmen||""} onChange={v=>setZu(rm.id,f.id,v)}/>}
        {isA("geometrie")&&<div style={{marginBottom:8}}><div style={$.cardT}>Fenstergeometrie</div><GeoEditor geo={f.geometrie} onChange={ng=>setGeo(rm.id,f.id,ng)} verglasungen={f.verglasungen} onJump={vgId=>{const vv=(f.verglasungen||[]).find(x=>x.id===vgId);if(vv){setRoom(rm);setFen(f);setVg(vv);setNumVal("");setView("measure");}}} onSyncVg={()=>syncVgFromGeo(rm.id,f.id)}/></div>}
        {isA("rahmenmasse")&&<div style={{marginBottom:8}}><div style={$.cardT}>Rahmen-Abmessungen</div><RahmenMasse val={f.rahmenmasse} onChange={nm=>setMasse(rm.id,f.id,nm)}/></div>}
        {(f.verglasungen||[]).map(v=>{const lm=v.messungen?.[v.messungen.length-1];return <div key={v.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",background:C.sf2,borderRadius:7,marginBottom:3}}>
          <div style={{display:"flex",alignItems:"center",gap:6,flex:1,cursor:"pointer"}} onClick={()=>{setRoom(rm);setFen(f);setVg(v);setNumVal("");setView("measure");}}>
            <span style={{fontWeight:700,fontSize:13}}>Verglasung {v.nr}</span>{lm&&<span style={{fontFamily:"monospace",color:C.ac,fontWeight:700,fontSize:12}}>{fmtMs(lm)}</span>}{(v.messungen?.length||0)>1&&<span style={{...$.badge,background:C.sf,color:C.tx2,fontSize:10}}>{v.messungen.length}×</span>}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:4}}>
            <button style={{background:"none",border:"none",color:C.err,cursor:"pointer",fontSize:13,padding:"2px 4px"}} onClick={()=>{const last=(f.verglasungen||[]).length<=1;if(confirm(last?`Letzte Verglasung – Fenster ${f.nr} komplett löschen?`:`Verglasung ${v.nr} löschen?`))delVg(rm.id,f.id,v.id);}}>🗑</button>
            <span style={{color:C.tx3,cursor:"pointer"}} onClick={()=>{setRoom(rm);setFen(f);setVg(v);setNumVal("");setView("measure");}}>›</span>
          </div>
        </div>;})}
        <button style={{...$.btn,...$.bO,...$.bS,marginTop:2}} onClick={()=>addVgToFen(rm.id,f.id)}>+ Verglasung</button>
        <div style={{marginTop:6}}><Photos label="Fenster-Fotos" photos={f.photos||[]} onAdd={ph=>addPh(rm.id,f.id,null,ph)} onDel={pid=>delPh(rm.id,f.id,null,pid)}/></div></div>;
    })}
    {/* Add button */}
    {isV?<button style={{...$.btn,...$.bP,...$.bBl,marginTop:8}} onClick={()=>{addFen(rm.id);flash("Verglasung +");}}>+ Verglasung hinzufügen</button>
    :<button style={{...$.btn,...$.bP,...$.bBl,marginTop:8}} onClick={()=>{setFmF({nr:`F${(rm.fenster?.length||0)+1}`,va:1});setModal("addF");}}>+ Fenster hinzufügen</button>}
  </div>
    {edR&&<div style={$.modal} onClick={()=>setEdR(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Raum bearbeiten</div>
      <TraktPick value={edR.trakt} list={traktList(p)} onChange={v=>setEdR({...edR,trakt:v})}/>
      <div style={{marginBottom:8}}><label style={$.lbl}>Geschoss</label><select style={$.sel} value={edR.geschoss} onChange={e=>setEdR({...edR,geschoss:e.target.value})}>{(FLOORS.includes(edR.geschoss)?FLOORS:[edR.geschoss,...FLOORS]).map(f=><option key={f}>{f}</option>)}</select></div>
      <div style={{marginBottom:8}}><label style={$.lbl}>Raum / Bezeichnung</label><input style={$.inp} value={edR.raumnummer} onChange={e=>setEdR({...edR,raumnummer:e.target.value})}/></div>
      <div style={{marginBottom:14}}><label style={$.lbl}>Raum-ID (optional)</label><input style={$.inp} value={edR.raumId} onChange={e=>setEdR({...edR,raumId:e.target.value})}/></div>
      <button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{if(!edR.raumnummer.trim()&&!edR.raumId.trim()){flash("Raum oder Raum-ID angeben");return;}setRoomProps(rm.id,{trakt:(edR.trakt||"").trim(),geschoss:edR.geschoss,raumnummer:edR.raumnummer.trim(),raumId:edR.raumId.trim()});setEdR(null);flash("Raum gespeichert");}}>Speichern</button></div></div>}
    {modal==="addF"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:14}}>Fenster hinzufügen</div>
      <div style={{marginBottom:8}}><label style={$.lbl}>Fenster-Nr.</label><input style={$.inp} value={fmF.nr} onChange={e=>setFmF({...fmF,nr:e.target.value})} autoFocus/></div>
      <div style={{marginBottom:6}}><label style={$.lbl}>Verglasungen (Start)</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,6].map(n=><button key={n} style={{...$.btn,flex:1,...((fmF.va||1)===n?$.bP:$.bO)}} onClick={()=>setFmF({...fmF,va:n})}>{n}</button>)}</div></div>
      <div style={{fontSize:11,color:C.tx2,marginBottom:14}}>Verglasungszahl später pro Fenster mit +/− anpassbar oder „aus Geometrie übernehmen". Für mehrere gleiche Fenster: ein Fenster anlegen und mit „⧉ Duplizieren" kopieren.</div>
      <button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{addFen(rm.id,fmF.nr,fmF.va||1);setModal(null);flash("Fenster +");}}>Hinzufügen</button></div></div>}
    {modal==="dupR"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:6}}>Raum duplizieren</div><div style={{fontSize:12,color:C.tx2,marginBottom:12}}>Erzeugt Kopien dieses Raums mit Aufbau, Geometrie und Stammdaten – ohne Messungen und Fotos. Raumnummern danach anpassen.</div><div style={{marginBottom:14}}><label style={$.lbl}>Anzahl Kopien</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,10].map(n=><button key={n} style={{...$.btn,flex:1,...(dupQty===n?$.bP:$.bO)}} onClick={()=>setDupQty(n)}>{n}</button>)}</div></div><button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{dupRoom(rm.id,dupQty);setModal(null);}}>Duplizieren</button></div></div>}
    {modal==="dupF"&&<div style={$.modal} onClick={()=>setModal(null)}><div style={$.modalC} onClick={e=>e.stopPropagation()}><div style={$.modalH}/><div style={{fontWeight:800,fontSize:16,marginBottom:6}}>Fenster duplizieren</div><div style={{fontSize:12,color:C.tx2,marginBottom:12}}>Erzeugt Kopien dieses Fensters mit Daten, Geometrie und Verglasungs-Aufbau – ohne Messungen und Fotos. Zustand und Angaben danach pro Kopie anpassen.</div><div style={{marginBottom:14}}><label style={$.lbl}>Anzahl Kopien</label><div style={{display:"flex",gap:4}}>{[1,2,3,4,5,10].map(n=><button key={n} style={{...$.btn,flex:1,...(dupQty===n?$.bP:$.bO)}} onClick={()=>setDupQty(n)}>{n}</button>)}</div></div><button style={{...$.btn,...$.bP,...$.bBl}} onClick={()=>{dupFen(rm.id,dupFenId,dupQty);setModal(null);}}>Duplizieren</button></div></div>}
  {Toast}</div>;}

  // MEASURE
  if(view==="measure"){const p=proj;const rm=p.rooms.find(r=>r.id===room?.id);const f=rm?.fenster?.find(x=>x.id===fen?.id);const v=f?.verglasungen?.find(x=>x.id===vg?.id);
    if(!rm||!f||!v){setView("room");return null;}
    const isV=p.modus==="verglasung";const label=isV?f.nr:`${f.nr} · Verglasung ${v.nr}`;const vf=vFs();
    let all=[];rm.fenster.forEach(x=>x.verglasungen.forEach(y=>all.push({f:x,v:y})));const idx=all.findIndex(x=>x.v.id===v.id);const tot=all.length;const msd=all.filter(x=>vgErf(x.f,x.v)).length;
    const go=i=>{setFen(all[i].f);setVg(all[i].v);setNumVal("");};
    const navTo=(i)=>guardNav(()=>go(i));
    const navBack=()=>guardNav(()=>setView("room"));
    const navRoom=()=>guardNav(()=>{setNumVal("");setView("room");});

    // Add extra verglasung and navigate to it
    const addAndGoExtra=()=>{
      const nf=addExtraVg(rm.id);
      if(nf){setFen(nf);setVg(nf.verglasungen[0]);setNumVal("");}
      flash("Weitere Verglasung +");
    };

  return <div className="app" style={$.app}><div style={$.hdr}><button style={$.hdrB} onClick={navBack}>← Raum</button><div style={$.hdrT}>{rm.raumnummer} · {label}</div></div><div className="body" style={$.body}>
    <div style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:C.tx2,marginBottom:3}}><span>Verglasung {idx+1}/{tot}</span><span>{msd}/{tot} erfasst</span></div><div style={$.prog}><div style={$.progF(tot>0?(msd/tot)*100:0)}/></div></div>
    {vf.length>0&&<div style={$.card}><div style={$.cardT}>Verglasung</div>{vf.map(([k,d])=><FldInp key={k} k={k} def={d} value={v.data?.[k]||""} source={v.sources?.[k]||""} onVal={val=>setFV(rm.id,f.id,v.id,k,val)} onSrc={s=>setFS(rm.id,f.id,v.id,k,s)} defaultVal={getDef(k,f,v)} showSrc={proj?.showSrc}/>)}</div>}
    {isA("stempel")&&<div style={$.card}><div style={$.cardT}>Glasstempel</div><DInp style={{...$.inp,...$.inpS}} value={v.data?.stempel||""} onCommit={val=>setFV(rm.id,f.id,v.id,"stempel",val)} placeholder="Herstellerangaben"/><div style={{marginTop:6}}><Photos label="Stempel-Foto" photos={(v.photos||[]).filter(p=>p.isStempel)} onAdd={ph=>addPh(rm.id,f.id,v.id,{...ph,isStempel:true})} onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/></div></div>}
    <div style={$.card}><Photos label="Verglasung-Fotos" photos={(v.photos||[]).filter(p=>!p.isStempel)} onAdd={ph=>addPh(rm.id,f.id,v.id,ph)} onDel={pid=>delPh(rm.id,f.id,v.id,pid)}/></div>
    {(()=>{const T=MS_TYPES[msT]||MS_TYPES.gas;const ms=v.messungen||[];const groups=MS_KEYS.map(t=>({t,list:ms.map((m,idx)=>({m,idx})).filter(x=>msTyp(x.m)===t)})).filter(g=>g.list.length);
      return <div style={$.card}>
        <div onClick={()=>setShowGas(g=>!g)} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,cursor:"pointer"}}>
          <div style={{...$.cardT,marginBottom:0}}>Messungen <span style={{color:C.tx3,fontWeight:400,letterSpacing:0,textTransform:"none"}}>· optional</span></div>
          <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",justifyContent:"flex-end"}}>{groups.map(g=>{const st=msStats(g.list.map(x=>x.m)),U=MS_TYPES[g.t];return <span key={g.t} style={{...$.badge,background:C.acBg,color:C.ac,fontFamily:"monospace"}}>{U.short} {st.n>1?"Ø ":""}{st.avg} {U.unit}{st.n>1?` ×${st.n}`:""}</span>;})}<span style={{fontSize:12,color:C.tx3,transition:"transform 0.2s",transform:showGas?"rotate(0deg)":"rotate(-90deg)"}}>▼</span></div>
        </div>
        {showGas&&<div style={{marginTop:12}}>
          <div style={{display:"flex",gap:4,marginBottom:4}}>{MS_KEYS.map(t=><button key={t} style={{...$.btn,...$.bS,flex:1,padding:"7px 2px",flexDirection:"column",gap:1,...(msT===t?$.bP:$.bO)}} onClick={()=>{setMsT(t);if(!MS_TYPES[t].neg&&numVal.startsWith("-"))setNumVal(numVal.slice(1));}}><span style={{fontWeight:700}}>{MS_TYPES[t].label}</span><span style={{fontSize:10,opacity:0.8}}>{MS_TYPES[t].unit}</span></button>)}</div>
          <NumPad value={numVal} onChange={setNumVal} unit={T.unit} neg={!!T.neg} onSubmit={val=>addMs(rm.id,f.id,v.id,msT,val)}/>
          <div style={{fontSize:10,color:C.tx3,marginTop:6}}>Beliebig viele Werte je Messart möglich – jeder Wert wird mit Zeitstempel gespeichert.</div>
          {groups.map(g=>{const st=msStats(g.list.map(x=>x.m)),U=MS_TYPES[g.t];return <div key={g.t} style={{marginTop:12}}>
            <div style={{...$.cardT,marginBottom:4}}>{U.label} ({st.n}){st.n>1&&<span style={{textTransform:"none",fontWeight:400,color:C.tx3,letterSpacing:0}}> · Ø {st.avg} · {st.min} bis {st.max} {U.unit}</span>}</div>
            {g.list.map(({m,idx},j)=><div key={idx} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:j<g.list.length-1?`1px solid ${C.bd}`:"none"}}><div><span style={{fontFamily:"monospace",fontWeight:800,fontSize:16}}>{m.wert} {U.unit}</span><span style={{fontSize:10,color:C.tx2,marginLeft:8}}>{new Date(m.zeit).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></div><button style={{background:"none",border:"none",color:C.err,cursor:"pointer",fontSize:18,padding:"2px 8px"}} onClick={()=>{if(confirm(`${U.label} ${m.wert} ${U.unit} löschen?`))delMs(rm.id,f.id,v.id,idx);}}>×</button></div>)}
          </div>;})}
        </div>}
      </div>;})()}
    {/* Navigation */}
    <div style={{display:"flex",gap:6,marginTop:8}}>
      {idx>0&&<button style={{...$.btn,...$.bO,flex:1}} onClick={()=>navTo(idx-1)}>← Vorherige</button>}
      {idx<tot-1?<button style={{...$.btn,...$.bP,flex:1}} onClick={()=>navTo(idx+1)}>Nächste →</button>
      :<button style={{...$.btn,...$.bOk,flex:1}} onClick={navRoom}>✓ Raum fertig</button>}
    </div>
    {/* Add extra verglasung */}
    {isV&&<button style={{...$.btn,...$.bO,...$.bBl,marginTop:8}} onClick={addAndGoExtra}>+ Weitere Verglasung</button>}
  </div>
  {/* Confirm dialog for unsaved data */}
  {confirmNav&&<ConfirmDialog message="Es gibt einen noch nicht gespeicherten Messwert im Ziffernblock. Ohne Speichern fortfahren?" onYes={()=>{setNumVal("");confirmNav.action();setConfirmNav(null);}} onNo={()=>setConfirmNav(null)}/>}
  {Toast}</div>;}

  return null;
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
